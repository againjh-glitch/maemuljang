<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>매물장 응대 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: 상단 바 + 탭, 응대 마법사는 [단계 본문 | 실시간 매칭 패널] 2단, 좁으면 1단 */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E9EEF0; --ink:#15232A; --muted:#5A6A72; --line:#D8E0E3;
  --brand:#1D5768; --brand-ink:#FFFFFF; --brand-soft:#E1EDF0; --stamp:#BF3328; --stamp-soft:#FBE9E7;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --warn:#A8701A; --warn-soft:#FBF0DC;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-disp:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1619; --surface:#162125; --sunk:#1C2A2F; --ink:#E4ECEE; --muted:#93A4AB; --line:#2A393E;
  --brand:#6DB1C3; --brand-ink:#0B1416; --brand-soft:#1B3239; --stamp:#E6685E; --stamp-soft:#3A1F1C;
  --ok:#5FC28B; --ok-soft:#173226; --warn:#E2AA4C; --warn-soft:#352A15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1619; --surface:#162125; --sunk:#1C2A2F; --ink:#E4ECEE; --muted:#93A4AB; --line:#2A393E;
  --brand:#6DB1C3; --brand-ink:#0B1416; --brand-soft:#1B3239; --stamp:#E6685E; --stamp-soft:#3A1F1C;
  --ok:#5FC28B; --ok-soft:#173226; --warn:#E2AA4C; --warn-soft:#352A15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.mark{display:flex;align-items:baseline;gap:8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.mark b{font-family:var(--f-disp);font-size:22px;letter-spacing:-.5px}
.mark span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
main{padding-block:22px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:24px;letter-spacing:-.4px}
h2{font-size:19px;letter-spacing:-.3px}
h3{font-size:15px}
.sub{color:var(--muted);margin:4px 0 0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
/* home */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.door{display:flex;flex-direction:column;gap:10px;text-align:left;padding:24px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:inherit;min-width:0}
.door:hover{border-color:var(--brand)}
.door:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.door .k{font-family:var(--f-disp);font-size:26px;letter-spacing:-.6px}
.door .who{font-size:13px;font-weight:600;color:var(--brand)}
.door.sell .who{color:var(--stamp)}
.door ol{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.door .go{margin-top:auto;font-weight:600;color:var(--brand)}
.door.sell .go{color:var(--stamp)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.section{margin-top:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:16px;align-items:start}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px;font-weight:600}
.step.on{border-color:var(--brand);color:var(--ink);font-weight:600}
.step.on i{background:var(--brand);color:var(--brand-ink)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel + .panel{margin-top:14px}
.say{background:var(--brand-soft);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.say .lbl{color:var(--brand)}
.say p{margin:4px 0 0}
.tip{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.tip b{color:var(--warn)}
.checks{display:grid;gap:6px;margin:10px 0}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=tel],input[type=number],input[type=search],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.seg .chip{border-radius:8px;padding:9px 16px;font-weight:600}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.live .count{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.live .count small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.mini{display:grid;gap:8px;margin-top:12px}
.mini .it{padding:9px 10px;border-radius:8px;background:var(--sunk);font-size:13px;cursor:pointer}
.mini .it b{display:block;font-size:14px}
/* listing cards */
.results{display:grid;gap:10px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--brand)}
.card.pick{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.card .ttl{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:13px;grid-column:1/-1}
.card .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.card .rs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.price{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.pr{font-weight:700;font-size:15px}
.pr em{font-style:normal;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:4px;background:var(--sunk);color:var(--muted)}
.pr.S em{background:var(--stamp-soft);color:var(--stamp)}
.pr.J em{background:var(--brand-soft);color:var(--brand)}
.pr.M em{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:12px;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.hot{background:var(--stamp);color:#fff;font-weight:600}
.tag.good{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--stamp-soft);color:var(--stamp)}
.tag.unk{background:var(--warn-soft);color:var(--warn)}
.score{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.score.near{background:var(--warn-soft);color:var(--warn)}
.date{font-size:12px;color:var(--muted)}
.date.old{color:var(--warn);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
/* search layout */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
.filters .field{margin-top:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) 20px;border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;margin-top:12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
pre.raw{white-space:pre-wrap;word-break:break-word;background:var(--sunk);padding:12px;border-radius:8px;font-family:var(--f-body);font-size:13px;margin:8px 0 0;max-height:320px;overflow:auto}
.phone{font-weight:600;user-select:all}
.lockbox{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin-top:12px}
.secret{background:var(--stamp-soft);border-radius:6px;padding:2px 6px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:90vw}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.scrollx{overflow-x:auto}
.copybox{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;font-size:13px;margin-top:10px}
.deal-row{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
.hint{font-size:12px;color:var(--brand);font-weight:600;min-height:16px}
em.auto{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:4px}
.cxcard{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--brand-soft)}
details.panel summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
section > .panel + .panel, section > .panel + details, section > details + .panel{margin-top:14px}
@media (max-width:900px){
  .wiz,.split{grid-template-columns:minmax(0,1fr)}
  .live,.filters{position:static;max-height:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .doors{grid-template-columns:1fr}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .deal-row{grid-template-columns:1fr 1fr}
  .sync{display:none}
  header.top{position:static}
  .topin{gap:8px}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%}
  nav.tabs a{white-space:nowrap}
  .seg .chip{padding:7px 12px}
  .card{grid-template-columns:minmax(0,1fr)}
  .card .side{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <a class="mark" href="#home"><b>매물장</b><span>응대 데스크</span></a>
  <nav class="tabs" id="tabs">
    <a href="#seek" data-v="seek">집 보러 온 손님</a>
    <a href="#sell" data-v="sell">집 내놓는 손님</a>
    <a href="#search" data-v="search">매물 검색</a>
    <a href="#clients" data-v="clients">대기 손님</a>
    <a href="#setup" data-v="setup">설정</a>
  </nav>
  <div class="sync"><i class="dot" id="dot"></i><span id="syncTxt">불러오는 중</span></div>
</div></header>
<main class="wrap" id="main"></main>
<div id="layer"></div>

<script>
'use strict';
/* ---------- 상수 ---------- */
const CATS=['아파트','빌라','오피스텔','단독·다가구','상가주택','상가·사무실','건물','토지','기타'];
const DEALS=['매매','전세','월세'];
const DK={매매:'S',전세:'J',월세:'M'};
const TAGS_SELL=['급매','공실','올수리','테라스','시스템에어컨','풀옵션','원룸','반지하','지층','옥탑','단독매물','신탁','위반건축물','권리금없음','분양권'];
const DIRS=['남향','남동향','남서향','동향','서향','북향','북동향','북서향'];
const S={L:[],C:[],db:null,live:false,view:'home'};
const today=new Date();

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function man(p){ if(p==null||p==='')return ''; p=+p; if(p>=10000){const e=Math.floor(p/10000),r=Math.round(p%10000);return e+'억'+(r?' '+r.toLocaleString():'');} return p.toLocaleString(); }
function dealTxt(d){ return d.t==='월세'?`${man(d.p)}/${d.r}`:man(d.p); }
/* "4억5천" "4.5억" "3천" "45000" → 만원 */
function parseMan(s){
  if(s==null)return null; s=String(s).replace(/[,\s원]/g,'').replace(/만$/,''); if(!s)return null;
  let v=0;
  if(s.includes('억')){const [a,b]=s.split('억'); v=parseFloat(a||'0')*10000; if(b) v+=restMan(b);}
  else v=restMan(s);
  return isNaN(v)?null:Math.round(v);
}
function restMan(b){ b=b.replace(/만$/,''); if(!b)return 0;
  if(b.includes('천')){const [x,y]=b.split('천'); let v=parseFloat(x||'1')*1000; if(y) v+=y.includes('백')?parseFloat(y)*100:parseFloat(y)||0; return v;}
  if(b.includes('백')) return parseFloat(b)*100;
  const n=parseFloat(b); return n; }
function ago(d){ if(!d)return 9999; return Math.floor((today-new Date(d))/86400000); }
function dshort(d){ return d? d.slice(2).replace(/-/g,'.'):''; }
function todayISO(){ const t=new Date(); return new Date(t-t.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
async function copy(txt,btn){ try{ await navigator.clipboard.writeText(txt); toast('복사했습니다'); }catch(e){ const box=btn&&btn.closest('.panel')?.querySelector('.copybox'); if(box){const r=document.createRange(); r.selectNodeContents(box); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast('텍스트를 선택해 두었습니다. Ctrl+C로 복사하세요'); } }
function title(l){ return l.name&&l.addr&&!l.addr.includes(l.name.split(' ')[0])? `${l.name} · ${l.addr}` : (l.addr||l.name||'(주소 미기재)'); }
function specs(l){ const a=[l.cat]; if(l.area)a.push(l.area); if(l.rooms!=null)a.push('방'+l.rooms+(l.baths!=null?'·화'+l.baths:'')); if(l.py)a.push(l.py+'평'); if(l.year)a.push(l.year+'년'); if(l.dir)a.push(l.dir);
  if(l.elev===true)a.push('엘베O'); if(l.elev===false)a.push('엘베X'); if(l.park===true)a.push('주차O'); if(l.park===false)a.push('주차X'); if(l.pet===false)a.push('반려동물X'); if(l.pet===true)a.push('반려동물O'); return a.join(' · '); }
function priceHTML(l){ if(!l.deals||!l.deals.length) return '<span class="pr"><em>?</em>거래조건 확인필요</span>'; return l.deals.map(d=>`<span class="pr ${DK[d.t]}"><em>${d.t}</em>${dealTxt(d)}</span>`).join(''); }

/* ---------- 매칭 엔진 ---------- */
function emptyQ(){ return {deal:'',budget:'',budgetMin:'',rentMax:'',cats:[],areas:[],kw:'',rooms:0,baths:0,py:'',elev:false,park:false,pet:false,needIns:false,lh:false,hideOld:false,showAll:false}; }
function match(l,q){
  const showAll=q.showAll;
  if(!showAll && l.st!=='active') return null;
  const R=[]; let s=60, near=false;
  const ds=(l.deals||[]).filter(d=>!q.deal||d.t===q.deal);
  if(q.deal && !ds.length) return null;
  const B=parseMan(q.budget), Bmin=parseMan(q.budgetMin), RM=q.rentMax===''?null:+q.rentMax;
  if(B||RM){
    let best='over';
    for(const d of ds){
      let st='ok';
      if(d.t==='월세'){
        if(B && d.p>B) st = d.p<=B*1.2? 'near':'over';
        if(RM!=null && d.r>RM){ const n= d.r<=RM*1.15+5? 'near':'over'; st = st==='over'||n==='over'?'over':'near'; }
      } else if(B && d.p>B){ st = d.p<=B*1.1? 'near':'over'; }
      if(st==='ok'){best='ok';break;} if(st==='near') best='near';
    }
    if(!ds.length) best='ok';
    if(best==='over') return null;
    if(best==='near'){ near=true; s-=18; R.push(['예산 조금 초과','unk']); } else { s+=10; R.push(['예산 안','good']); }
    if(Bmin && ds.length && ds.every(d=>d.p<Bmin*0.7)){ s-=6; R.push(['예산보다 많이 저렴','unk']); }
  }
  if(q.cats.length && !q.cats.includes(l.cat)) return null;
  if(q.areas.length){ if(!l.area){ s-=5; R.push(['지역 확인','unk']); } else if(!q.areas.includes(l.area)) return null; else { s+=6; } }
  const num=(k,label,unit)=>{ const want=+q[k]; if(!want) return true; if(l[k]==null){ s-=7; R.push([label+' 미확인','unk']); return true; } if(l[k]<want) return false; s+=8; R.push([label+l[k]+(unit||''),'good']); return true; };
  if(!num('rooms','방')) return null;
  if(!num('baths','화장실')) return null;
  const P=parseFloat(q.py); if(P){ if(l.py==null){ s-=5; R.push(['평수 미확인','unk']); } else if(l.py<P*0.85) return null; else { s+=5; R.push([l.py+'평','good']); } }
  const flag=(k,label)=>{ if(!q[k]) return true; if(l[k]===false) return false; if(l[k]===true){ s+=7; R.push([label+' 가능','good']); } else { s-=5; R.push([label+' 확인','unk']); } return true; };
  if(!flag('elev','엘베')) return null;
  if(!flag('park','주차')) return null;
  if(!flag('pet','반려동물')) return null;
  const tags=l.tags||[];
  if(q.needIns){ if(tags.some(t=>['보증보험불가','전세대출불가','위반건축물'].includes(t))) return null;
    if(tags.some(t=>['보증보험가능','안심전세가능','전세대출가능'].includes(t))){ s+=8; R.push(['보증보험·대출 가능','good']); } else { s-=4; R.push(['보증보험 확인','unk']); } }
  if(q.lh){ if(tags.includes('LH불가')) return null; if(tags.includes('LH협의')){s+=6;R.push(['LH 협의','good']);} else R.push(['LH 가능 여부 확인','unk']); }
  if(q.kw){ const hay=[l.name,l.addr,l.note,l.area,l.cat,(l.tags||[]).join(' '),l.raw].join(' ').toLowerCase().replace(/\s/g,'');
    for(const w of q.kw.toLowerCase().split(/[\s,]+/).filter(Boolean)) if(!hay.includes(w)) return null; s+=4; }
  const age=ago(l.d);
  if(age>365){ if(q.hideOld) return null; s-=15; R.push(['1년 넘음 · 진행 여부 확인','unk']); }
  else if(age<=60){ s+=8; R.push(['최근 접수','good']); }
  if(tags.includes('급매')) s+=3; if(tags.includes('올수리')) s+=3; if(tags.includes('공실')) s+=2;
  if(l.st!=='active') s-=30;
  return {s:Math.max(1,Math.min(99,Math.round(s))),R,near};
}
function runMatch(q,list){ list=list||S.L; const out=[]; for(const l of list){ const m=match(l,q); if(m) out.push({l,...m}); }
  out.sort((a,b)=>(a.near-b.near)||(b.s-a.s)||((b.l.d||'').localeCompare(a.l.d||''))); return out; }
function clientQ(c){ const q=emptyQ(); q.deal=c.deal||''; q.budget=c.budget??''; q.budgetMin=c.budgetMin??''; q.rentMax=c.rentMax??'';
  q.cats=c.cats||(c.cat?[c.cat]:[]); q.areas=c.areas||[]; q.rooms=c.rooms||0; q.baths=c.baths||0; q.py=c.py||''; q.kw=c.kw||'';
  q.elev=!!c.elev; q.park=!!c.park||(c.tags||[]).includes('주차필수'); q.pet=!!c.pet; q.needIns=!!c.needIns||(c.tags||[]).includes('보증보험필요'); q.lh=!!c.lh||(c.tags||[]).includes('LH');
  q.hideOld=true; return q; }
function clientsFor(l){ return S.C.filter(c=>c.st==='waiting').map(c=>({c,m:match(l,clientQ(c))})).filter(x=>x.m && !x.m.near).sort((a,b)=>b.m.s-a.m.s); }
function qSummary(q){ const a=[]; if(q.deal)a.push(q.deal); const B=parseMan(q.budget); if(B)a.push((q.deal==='월세'?'보증금 ':'')+man(B)+' 이하'); if(q.rentMax!=='')a.push('월 '+q.rentMax+' 이하');
  if(q.cats.length)a.push(q.cats.join('/')); if(q.areas.length)a.push(q.areas.join('/')); if(+q.rooms)a.push('방'+q.rooms+'+'); if(+q.baths)a.push('화'+q.baths+'+'); if(q.py)a.push(q.py+'평+');
  if(q.elev)a.push('엘베'); if(q.park)a.push('주차'); if(q.pet)a.push('반려동물'); if(q.needIns)a.push('보증보험'); if(q.lh)a.push('LH'); if(q.kw)a.push('"'+q.kw+'"'); return a.join(' · ')||'조건 없음'; }

function cardHTML(x,opt={}){ const l=x.l||x, m=x.s!=null?x:null; const age=ago(l.d);
  const stTag= l.st==='done'?'<span class="tag bad">거래완료</span>': l.st==='hold'?'<span class="tag unk">보류</span>':'';
  const tags=(l.tags||[]).map(t=>`<span class="tag ${t==='급매'?'hot':''}">${esc(t)}</span>`).join('');
  return `<button class="card ${opt.pick?'pick':''}" data-act="open" data-id="${l.id}">
    <div class="ttl">${esc(title(l))}</div>
    <div class="side">${m?`<span class="score ${m.near?'near':''}">${m.near?'근접':'일치'} ${m.s}</span>`:''}<span class="date ${age>365?'old':''}">${dshort(l.d)} 접수</span></div>
    <div class="price">${priceHTML(l)}</div>
    <div class="meta">${esc(specs(l))}${l.note?' — '+esc(l.note):''}</div>
    <div class="rs">${stTag}${tags}${m?m.R.map(r=>`<span class="tag ${r[1]}">${esc(r[0])}</span>`).join(''):''}</div>
  </button>`; }

/* ---------- 필터 컨트롤 (보러온 손님 / 검색 공용) ---------- */

function chipsHTML(scope,key,opts,sel,multi){ return `<div class="chips ${multi?'':'seg'}">`+opts.map(o=>{ const on= multi? sel.includes(o): sel===o; return `<button class="chip ${on?'on':''}" data-scope="${scope}" data-chip="${key}" data-val="${esc(o)}" data-multi="${multi?1:0}">${esc(o)}</button>`; }).join('')+`</div>`; }
function dealFields(scope,q){
  const isM=q.deal==='월세';

      :`<label class="field"><span>최소 금액 (선택)</span><input type="text" id="${scope}-bmin" data-scope="${scope}" data-q="budgetMin" value="${esc(q.budgetMin)}" placeholder="예: 1억"><span class="hint" id="${scope}-budgetMin-h">${parseMan(q.budgetMin)?man(parseMan(q.budgetMin))+' 만원':''}</span></label>`}
  </div>`;
}
function homeFields(scope,q){
  return `<div class="field"><span>집 종류 (여러 개 선택 가능, 안 고르면 전체)</span>${chipsHTML(scope,'cats',CATS,q.cats,true)}</div>

}

function dongHo(text,cx){ const t=String(text||'').replace(/01[0-9][\s-]?\d{3,4}[\s-]?\d{4}/g,' ');

    const k=dh.dong+'-'+dh.line; (st[k]=st[k]||{dong:dh.dong,line:dh.line,dirs:{}}).dirs[l.dir]=(st[k].dirs[l.dir]||0)+1; }

  const dongAll={}; Object.values(st).filter(x=>x.dong===dh.dong).forEach(x=>Object.entries(x.dirs).forEach(([d,n])=>dongAll[d]=(dongAll[d]||0)+n));
  if(Object.keys(dongAll).length===1){ const [d,n]=topOf(dongAll); return {dir:d,why:`${dh.dong}동 다른 라인 기록 ${n}건 — 라인 확인 필요`,weak:true}; }
  return null; }
function dirSummary(cx){ const st=Object.values(dirStats(cx)); if(!st.length) return '';

/* ---------- 매물장 양식 / 문자 붙여넣기 → 자동 입력 ---------- */

function buildListing(){ const f=SELL.f;
  const deals=f.deals.map(d=>({t:d.t,p:parseMan(d.p),r:d.t==='월세'?(+d.r||0):undefined})).filter(d=>d.p).map(d=>{ if(d.r===undefined) delete d.r; return d; });
  const tags=[...f.tags];
  if(f.tenant==='공실'&&!tags.includes('공실')) tags.push('공실');
  if(f.ins==='가능'&&!tags.includes('보증보험가능')) tags.push('보증보험가능');
  if(f.ins==='불가'&&!tags.includes('보증보험불가')) tags.push('보증보험불가');
  if(f.loan==='신탁'&&!tags.includes('신탁')) tags.push('신탁');
  if(f.excl==='단독'&&!tags.includes('단독매물')) tags.push('단독매물');
  if(f.ad==='광고 안 함'&&!tags.includes('네이버광고X')) tags.push('네이버광고X');
  const notes=[]; if(f.options)notes.push(f.options); if(f.fee)notes.push('관리비 '+f.fee); if(f.movein)notes.push('입주 '+f.movein); if(f.tenant&&f.tenant!=='공실')notes.push(f.tenant);
  if(f.loan&&f.loan!=='신탁')notes.push('근저당 '+f.loan); if(f.fee2)notes.push(f.fee2); if(f.note)notes.push(f.note);
  const yn=(v,a,b)=>v===a?true:v===b?false:null; const num=v=>v===''||v==null?null:+v;
  if(!f.py&&(f.sup||f.ex)) f.py=String(pyOf(+(f.sup||f.ex)));
  if(f.sup||f.ex) notes.unshift([f.sup&&'공급 '+f.sup+'㎡',f.ex&&'전용 '+f.ex+'㎡'].filter(Boolean).join(' / '));
  const doc={cat:f.cat||'기타',deals,name:f.name.trim(),addr:[f.addr.trim(),(f.dongho||'').trim()].filter(Boolean).join(' '),area:f.area.trim(),rooms:num(f.rooms),baths:num(f.baths),py:num(f.py),year:num(f.year),dir:f.dir,
    elev:yn(f.elev,'있음','없음'),park:yn(f.park,'가능','불가'),pet:yn(f.pet,'가능','불가'),tags,note:notes.join(' / '),
    phones:[f.phone,f.phone2].map(p=>p.trim()).filter(Boolean),owner:[f.role,f.ownerName,f.carrier].filter(Boolean).join(' '),show:f.show,st:'active',d:todayISO()};
  Object.keys(doc).forEach(k=>{ if(doc[k]===null||doc[k]==='') delete doc[k]; });
  return doc; }

/* ---------- 저장소: 구글 시트 (Apps Script 웹앱) ----------
   시트 한 줄 = 매물 하나 / 손님 하나. 시트에서 직접 고쳐도 됩니다.
   거래조건 칸 형식: "매매 45000 / 전세 38000 / 월세 3000/60" (단위: 만원) */
const LCOLS=[['id','ID'],['st','상태'],['d','최근확인일'],['d0','최초접수일'],['cat','종류'],['deals','거래조건'],['name','단지·건물'],['addr','주소'],['area','동네'],['rooms','방'],['baths','화장실'],['py','평수'],['year','연식'],['dir','향'],['elev','엘베'],['park','주차'],['pet','반려동물'],['tags','특징'],['note','메모'],['phones','연락처'],['owner','내놓은분'],['show','집보는법'],['raw','원문'],['src','출처']];
const CCOLS=[['id','ID'],['st','상태'],['d','접수일'],['name','성함'],['phone','연락처'],['deal','거래'],['budget','예산최대'],['budgetMin','예산최소'],['rentMax','월세최대'],['cats','종류'],['areas','동네'],['rooms','방최소'],['baths','화장실최소'],['py','평수최소'],['kw','키워드'],['need','필수조건'],['people','인원'],['movein','이사시기'],['note','메모'],['shown','보여준매물'],['raw','원문'],['src','출처']];
const LST={active:'진행중',hold:'보류',done:'거래완료'}, CST={waiting:'대기중',done:'계약완료',hold:'보류'};
const NEEDS=[['elev','엘베'],['park','주차'],['pet','반려동물'],['needIns','보증보험'],['lh','LH']];
const inv=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
const list=v=>String(v??'').split(/\s*,\s*/).map(s=>s.trim()).filter(Boolean);
const numOr=v=>{ if(v===''||v==null) return undefined; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?undefined:n; };
function normDate(v){ v=String(v||'').trim(); const m=v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : ''; }
function parseDeals(s){ const out=[]; const re=/(매매|전세|월세|반전세)\s*([0-9][0-9,.억천]*)(?:\s*\/\s*([0-9]+))?/g; let m;
  while((m=re.exec(String(s||'')))){ const t=m[1]==='반전세'?'월세':m[1]; const p=parseMan(m[2]); if(!p) continue; const d={t,p}; if(t==='월세') d.r=+(m[3]||0); out.push(d); } return out; }
const dealsStr=ds=>(ds||[]).map(d=>`${d.t} ${d.p}${d.t==='월세'?'/'+(d.r||0):''}`).join(' / ');
const ox=v=>v===true?'O':v===false?'X':'';
const fromOx=v=>{ v=String(v||'').trim().toUpperCase(); return v==='O'||v==='0'||v==='○'||v==='가능'||v==='있음'?true: v==='X'||v==='불가'||v==='없음'?false: undefined; };
function fromRowL(o){ const r={}; LCOLS.forEach(([k,h])=>r[k]=o[h]??'');
  const l={id:String(r.id),st:inv(LST)[r.st]||'active',d:normDate(r.d),d0:normDate(r.d0),cat:r.cat||'기타',deals:parseDeals(r.deals),
    name:r.name,addr:r.addr,area:r.area,rooms:numOr(r.rooms),baths:numOr(r.baths),py:numOr(r.py),year:numOr(r.year),dir:r.dir,
    elev:fromOx(r.elev),park:fromOx(r.park),pet:fromOx(r.pet),tags:list(r.tags),note:r.note,phones:list(r.phones),owner:r.owner,show:r.show,raw:r.raw,src:r.src};
  if(o._locked) l.locked=list(o._locked);
  Object.keys(l).forEach(k=>{ if(l[k]===undefined||l[k]==='') delete l[k]; }); if(!l.tags) l.tags=[]; return l; }
function toRowL(l){ const r={id:l.id,st:LST[l.st]||'진행중',d:l.d||'',d0:l.d0||'',cat:l.cat||'',deals:dealsStr(l.deals),name:l.name||'',addr:l.addr||'',area:l.area||'',
    rooms:l.rooms??'',baths:l.baths??'',py:l.py??'',year:l.year??'',dir:l.dir||'',elev:ox(l.elev),park:ox(l.park),pet:ox(l.pet),tags:(l.tags||[]).join(', '),
    note:l.note||'',phones:(l.phones||[]).join(', '),owner:l.owner||'',show:l.show||'',raw:l.raw||'',src:l.src||''};
  const o={}; LCOLS.forEach(([k,h])=>o[h]=String(r[k]??'')); return o; }
function fromRowC(o){ const r={}; CCOLS.forEach(([k,h])=>r[k]=o[h]??''); const need=list(r.need);
  const c={id:String(r.id),st:inv(CST)[r.st]||'waiting',d:normDate(r.d),name:r.name,phone:r.phone,deal:r.deal,budget:numOr(parseMan(r.budget)),budgetMin:numOr(parseMan(r.budgetMin)),rentMax:numOr(r.rentMax),
    cats:list(r.cats),areas:list(r.areas),rooms:numOr(r.rooms),baths:numOr(r.baths),py:numOr(r.py),kw:r.kw,people:r.people,movein:r.movein,note:r.note,shown:list(r.shown),raw:r.raw,src:r.src};
  NEEDS.forEach(([k,t])=>{ if(need.includes(t)) c[k]=true; }); if(o._locked) c.locked=list(o._locked);
  Object.keys(c).forEach(k=>{ if(c[k]===undefined||c[k]==='') delete c[k]; }); return c; }
function toRowC(c){ const need=NEEDS.filter(([k])=>c[k]||(k==='park'&&(c.tags||[]).includes('주차필수'))||(k==='needIns'&&(c.tags||[]).includes('보증보험필요'))||(k==='lh'&&(c.tags||[]).includes('LH'))).map(x=>x[1]);
  const r={id:c.id,st:CST[c.st]||'대기중',d:c.d||'',name:c.name||'',phone:c.phone||'',deal:c.deal||'',budget:c.budget??'',budgetMin:c.budgetMin??'',rentMax:c.rentMax??'',
    cats:(c.cats||(c.cat?[c.cat]:[])).join(', '),areas:(c.areas||[]).join(', '),rooms:c.rooms||'',baths:c.baths||'',py:c.py||'',kw:c.kw||'',need:need.join(', '),
    people:c.people||'',movein:c.movein||'',note:c.note||'',shown:(c.shown||[]).join(', '),raw:c.raw||'',src:c.src||''};
  const o={}; CCOLS.forEach(([k,h])=>o[h]=String(r[k]??'')); return o; }

/* 설정: index.html 맨 아래 CONFIG.API_URL 에 주소를 넣어 두면 직원들은 비밀번호만 입력하면 됩니다 */
const LSX={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const apiUrl=()=>LSX.get('mj_api')||CONFIG.API_URL||'';
/* 비밀번호 두 단계: 사무실(mj_key, 이 브라우저에 기억) / 열람(mj_full, 기본은 브라우저를 닫거나 30분 쉬면 잠김) */
const SSX={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const fullKey=()=>SSX.get('mj_full')||LSX.get('mj_full')||'';
const apiKey=()=>fullKey()||LSX.get('mj_key')||'';
const isShared=()=>!!(apiUrl()&&apiKey());
const SECRET_H={listings:['연락처','내놓은분','집보는법','원문'],clients:['연락처','원문']};
S.level=0;
const canSee=()=>!isShared()||S.level>=2;
function lockAll(msg){ SSX.set('mj_full',null); LSX.set('mj_full',null); S.level=Math.min(S.level,1); if(msg) toast(msg); loadAll(true); }
let lastAct=Date.now(); ['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },true));
setInterval(()=>{ if(fullKey() && !LSX.get('mj_full') && Date.now()-lastAct>30*60000) lockAll('30분 동안 사용이 없어 열람을 잠갔습니다'); },60000);
async function unlock(pw,remember){ if(!pw){ toast('열람 비밀번호를 입력하세요'); return false; }
  try{ const r=await fetch(apiUrl()+'?action=list&key='+encodeURIComponent(pw)+'&t='+Date.now()); const j=await r.json();
    if(!j.ok||j.level<2){ toast('열람 비밀번호가 맞지 않습니다'); return false; }
    if(remember) LSX.set('mj_full',pw); else SSX.set('mj_full',pw);
    toast('연락처·현관 비밀번호를 볼 수 있습니다'); await loadAll(true); return true; }
  catch(e){ toast('연결하지 못했습니다'); return false; } }
function setSync(txt,live){ $('#syncTxt').textContent=txt; $('#dot').classList.toggle('live',!!live); }
async function apiGet(){ const r=await fetch(apiUrl()+'?action=list&key='+encodeURIComponent(apiKey())+'&t='+Date.now()); const j=await r.json(); if(!j.ok) throw new Error(j.error||'fail'); return j; }
async function apiPost(body){ const r=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:apiKey(),...body})}); const j=await r.json(); if(!j.ok) throw new Error(j.error||'fail'); return j; }
function localLoad(){ try{ const j=JSON.parse(LSX.get('mj_local')||'{}'); S.L=j.L||[]; S.C=j.C||[]; }catch(e){ S.L=[]; S.C=[]; } }
function localSave(){ LSX.set('mj_local',JSON.stringify({L:S.L,C:S.C})); }
let pending=0;
async function loadAll(quiet){
  if(!isShared()){ localLoad(); S.live=true; setSync('이 컴퓨터에만 저장 중 · 설정 필요',false); refresh(); return; }
  if(pending) return;
  try{ if(!quiet) setSync('불러오는 중',false); const j=await apiGet(); if(pending) return;
    S.L=(j.listings||[]).map(fromRowL).filter(l=>l.id); S.C=(j.clients||[]).map(fromRowC).filter(c=>c.id); S.level=j.level||1;
    if(fullKey()&&S.level<2){ SSX.set('mj_full',null); LSX.set('mj_full',null); }
    S.live=true; setSync((S.level>=2?'전체 열람 중':'공유 매물장 연결됨')+' · '+new Date().toTimeString().slice(0,5),true); refresh(); }
  catch(e){ S.live=true; setSync(String(e.message)==='password'?'비밀번호가 맞지 않습니다':'연결 실패 · 설정 확인',false); refresh(); }
}
async function putRec(kind,rec,okMsg){ const arr=kind==='listings'?S.L:S.C; const i=arr.findIndex(x=>x.id===rec.id); const exists=i>=0; if(exists) arr[i]=rec; else arr.push(rec); refresh();
  if(!isShared()){ localSave(); if(okMsg) toast(okMsg+' (이 컴퓨터에만)'); return true; }
  const row=kind==='listings'?toRowL(rec):toRowC(rec); if(exists&&!canSee()) SECRET_H[kind].forEach(h=>delete row[h]);
  pending++; try{ await apiPost({action:'upsert',sheet:kind,id:rec.id,rec:row}); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast('저장하지 못했습니다. 인터넷 연결과 설정을 확인하고 다시 눌러 주세요.'); return false; }
  finally{ pending--; if(!pending) loadAll(true); } }
async function updateRec(kind,id,patch,okMsg){ const arr=kind==='listings'?S.L:S.C; const cur=arr.find(x=>x.id===id); if(!cur) return false; return putRec(kind,{...cur,...patch},okMsg); }
async function removeRec(kind,id,okMsg){ if(kind==='listings') S.L=S.L.filter(x=>x.id!==id); else S.C=S.C.filter(x=>x.id!==id); refresh();
  if(!isShared()){ localSave(); toast(okMsg); return true; }
  pending++; try{ await apiPost({action:'delete',sheet:kind,id}); toast(okMsg); return true; }
  catch(e){ toast(String(e.message)==='level'?'삭제는 열람 비밀번호를 입력한 직원만 할 수 있습니다.':'삭제하지 못했습니다. 다시 눌러 주세요.'); return false; } finally{ pending--; if(!pending) loadAll(true); } }
setInterval(()=>{ if(isShared()&&document.visibilityState==='visible') loadAll(true); },60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&isShared()) loadAll(true); });

/* ---------- 설정 화면 ---------- */
function viewSetup(){ const u=apiUrl(), fixed=!!CONFIG.API_URL; const lvTxt=!isShared()?'연결 전 (이 컴퓨터에만 저장)':S.level>=2?'전체 열람 (연락처·현관 비밀번호 보임)':S.level===1?'기본 (연락처·현관 비밀번호 가림)':'확인 중';
  return `<h1>공유 설정</h1><p class="sub">모든 직원이 같은 매물장을 보려면 사무실 비밀번호를 입력합니다. 처음 한 번만 하면 됩니다.</p>
  <section class="panel" style="margin-top:16px;max-width:720px"><div class="lbl">현재 권한</div><h2 style="margin-top:4px">${lvTxt}</h2>
    <p class="sub" style="font-size:13px">${esc($('#syncTxt').textContent)}</p></section>
  <section class="panel" style="max-width:720px"><h3>1단계 · 사무실 비밀번호</h3><p class="sub" style="font-size:13px">매물 보기·검색·손님 응대·새 매물 접수. 이 컴퓨터에 기억됩니다.</p>
    <div class="fgrid">
      ${fixed?'':`<label class="field full"><span>구글 Apps Script 웹앱 주소</span><input type="text" id="set-api" value="${esc(LSX.get('mj_api')||'')}" placeholder="https://script.google.com/macros/s/…/exec"><small>관리자에게 받은 주소를 붙여 넣으세요.</small></label>`}
      <label class="field full"><span>사무실 비밀번호</span><input type="password" id="set-key" value="${esc(LSX.get('mj_key')||'')}" placeholder="관리자에게 받은 비밀번호" autocomplete="off"></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn pri" data-act="saveSetup">저장하고 연결</button><button class="btn ghost" data-act="logout">이 컴퓨터에서 비밀번호 모두 지우기</button></div></section>
  <section class="panel" style="max-width:720px"><h3>2단계 · 열람 비밀번호 (연락처·현관 비밀번호)</h3>
    <p class="sub" style="font-size:13px">집주인·손님 연락처, 현관 비밀번호, 매물장 원문, 삭제는 이 비밀번호를 입력한 사람만 됩니다. 기본은 브라우저를 닫거나 30분 동안 쓰지 않으면 다시 잠깁니다.</p>
    ${isShared()&&S.level>=2?'<div class="row" style="margin-top:10px"><span class="tag good">열람 중</span><button class="btn sm" data-act="lockNow">지금 잠그기</button></div>':(isShared()?lockBox('열람 비밀번호'):'<p class="sub">먼저 1단계를 연결하세요.</p>')}</section>
  <section class="panel" style="max-width:720px"><h3>비밀번호를 잊었을 때</h3>
    <p class="sub" style="font-size:13px">관리자가 구글 시트의 <b>「설정」 탭</b>을 열면 B1(사무실), B2(열람)에 적혀 있습니다. 거기서 바꾸면 바로 적용됩니다.</p></section>`; }
let rT=null; function refresh(){ clearTimeout(rT); rT=setTimeout(()=>{ const a=document.activeElement; if(a&&a.matches('input,textarea')&&a.id){ partial(); } else render(); if(DR) renderDrawer(); },60); }

/* ---------- 렌더 ---------- */
function render(){ const v=S.view;
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const m=$('#main');
  m.innerHTML= v==='seek'?viewSeek(): v==='sell'?viewSell(): v==='search'?viewSearch(): v==='clients'?viewClients(): v==='setup'?viewSetup(): viewHome(); }
/* 입력 중에는 포커스를 지키며 결과만 갱신 */
function partial(){ const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart;
  render(); if(id){ const el=document.getElementById(id); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } } }
function route(){ const h=(location.hash||'#home').slice(1); S.view=['seek','sell','search','clients','setup'].includes(h)?h:'home'; closeDrawer(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange',route);

/* ---------- 이벤트 ---------- */
function qOf(scope){ return scope==='seek'?SEEK.q:FIND.q; }
let typeT=null;
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset.q){ const q=qOf(t.dataset.scope); q[t.dataset.q]=t.value; clearTimeout(typeT); typeT=setTimeout(partial,180); return; }
  if(t.dataset.who){ SEEK.who[t.dataset.who]=t.value; return; }
  if(t.id==='f-paste'){ SELL.paste=t.value; return; }
  if(t.dataset.f){ SELL.f[t.dataset.f]=t.value; if(t.dataset.f==='sup'||t.dataset.f==='ex'){ const v=+(SELL.f.sup||SELL.f.ex); if(v) SELL.f.py=String(pyOf(v)); } clearTimeout(typeT); typeT=setTimeout(partial,250); return; }
  if(t.dataset.deal){ const d=SELL.f.deals[+t.dataset.deal]; d[t.dataset.dk]=t.value; if(t.dataset.dk==='t'){ render(); return; } clearTimeout(typeT); typeT=setTimeout(partial,250); return; }
});
document.addEventListener('change',async e=>{ const t=e.target;
  if(t.dataset.qc){ qOf(t.dataset.scope)[t.dataset.qc]=t.checked; partial(); return; }
  if(t.dataset.q && t.tagName==='SELECT'){ qOf(t.dataset.scope)[t.dataset.q]=t.value; partial(); return; }
  if(t.id==='f-name'){ const c=findComplex(t.value); if(c){ applyComplex(c,SELL.f,false); toast(c.name+' 단지 정보를 채웠습니다'); } autoDir(false); render(); return; }
  if(t.id==='f-dongho'){ const was=SELL.f.dir; autoDir(SELL.filled&&SELL.filled.has('dir')); if(SELL.f.dir!==was) toast('향을 '+SELL.f.dir+'(으)로 채웠습니다'); render(); return; }
  if(t.dataset.f && t.tagName==='SELECT'){ SELL.f[t.dataset.f]=t.value; if(t.dataset.f==='dir'&&SELL.filled) SELL.filled.delete('dir'); render(); return; }
  if(t.dataset.deal && t.dataset.dk==='t'){ const d=SELL.f.deals[+t.dataset.deal]; d.t=t.value; render(); return; }
  if(t.dataset.act==='sort'){ FIND.sort=t.value; render(); return; }
  if(t.dataset.act==='clientSt'){ await updateRec('clients',t.dataset.id,{st:t.value},'상태를 바꿨습니다'); return; }
  if(t.dataset.act==='lst'){ await updateRec('listings',DR.id,{st:t.value},'매물 상태를 바꿨습니다'); return; }
});
document.addEventListener('toggle',e=>{ if(e.target.id==='moreBox') SELL.moreOpen=e.target.open; },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&DR) closeDrawer(); if(e.key==='Enter'&&e.target.id==='unlock-pw') document.querySelector('[data-act=unlock]')?.click(); });
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-go],[data-chip],[data-fchip],[data-seekstep],[data-sellstep]'); if(!t) return;
  if(t.dataset.go){ location.hash=t.dataset.go; return; }
  if(t.dataset.chip){ const q=qOf(t.dataset.scope), k=t.dataset.chip, v=t.dataset.val;
    if(t.dataset.multi==='1'){ q[k]=q[k].includes(v)?q[k].filter(x=>x!==v):[...q[k],v]; } else { q[k]= q[k]===v?'':v; if(k==='deal'){ q.rentMax=''; } }
    render(); return; }
  if(t.dataset.fchip){ const f=SELL.f, k=t.dataset.fchip, v=t.dataset.val;
    if(t.dataset.multi==='1') f[k]=f[k].includes(v)?f[k].filter(x=>x!==v):[...f[k],v]; else f[k]= f[k]===v?'':v; render(); return; }
  if(t.dataset.seekstep!=null){ const n=+t.dataset.seekstep; if(n<0||n>4) return; SEEK.step=n; render(); window.scrollTo(0,0); return; }
  if(t.dataset.sellstep!=null){ const n=+t.dataset.sellstep; if(n<0||n>4) return; SELL.step=n; render(); window.scrollTo(0,0); return; }
  const a=t.dataset.act;
  if(a==='open'){ if(t.dataset.id==='_preview') return; openListing(t.dataset.id); return; }
  if(a==='openClient'){ openClient(t.dataset.id); return; }
  if(a==='close'){ closeDrawer(); return; }
  if(a==='pick'){ const id=DR.id; SEEK.picks=SEEK.picks.includes(id)?SEEK.picks.filter(x=>x!==id):[...SEEK.picks,id]; toast(SEEK.picks.includes(id)?'보여줄 집에 담았습니다':'뺐습니다'); renderDrawer(); render(); return; }
  if(a==='edit'){ const l=S.L.find(x=>x.id===DR.id); SELL.f=listingToF(l); SELL.editId=l.id; SELL.step=1; SELL.saved=null; closeDrawer(); if(location.hash!=='#sell') location.hash='sell'; else render(); return; }
  if(a==='touch'){ await updateRec('listings',DR.id,{d:todayISO()},'오늘 날짜로 확인 표시했습니다'); return; }
  if(a==='delL'){ if(!DR.del){ DR.del=true; renderDrawer(); return; } const id=DR.id; closeDrawer(); await removeRec('listings',id,'삭제했습니다'); return; }
  if(a==='delC'){ if(!DR.del){ DR.del=true; renderDrawer(); return; } const id=DR.id; closeDrawer(); await removeRec('clients',id,'삭제했습니다'); return; }
  if(a==='saveSetup'){ const u=($('#set-api')?.value||'').trim(), k=$('#set-key').value.trim(); if(u) LSX.set('mj_api',u); LSX.set('mj_key',k||null);
    if(!apiUrl()){ toast('웹앱 주소를 입력해 주세요'); return; } await loadAll(); render(); return; }
  if(a==='unlock'){ const ok=await unlock($('#unlock-pw').value.trim(),$('#unlock-rem')?.checked); if(ok){ renderDrawer(); render(); } return; }
  if(a==='lockNow'){ lockAll('열람을 잠갔습니다'); renderDrawer(); render(); return; }
  if(a==='logout'){ LSX.set('mj_key',null); SSX.set('mj_full',null); LSX.set('mj_full',null); S.level=0; toast('이 컴퓨터에서 비밀번호를 모두 지웠습니다'); loadAll(); render(); return; }
  if(a==='parsePaste'){ const txt=($('#f-paste')?.value||'').trim(); SELL.paste=txt; if(!txt){ toast('붙여넣을 내용을 먼저 넣어 주세요'); return; }
    const p=parseTemplate(txt); const n=applyParsed(p); SELL.pasteMsg=n?`${n}개 칸을 채웠습니다${p.cx?' · '+p.cx.name+' 단지 정보 자동 입력':''}. 노란 '자동' 표시를 확인하세요.`:'알아볼 수 있는 내용이 없습니다. 직접 입력해 주세요.'; render(); return; }
  if(a==='pickType'){ const c=findComplex(SELL.f.name); const tp=c&&c.types[+t.dataset.i]; if(tp){ applyType(tp,SELL.f,true); render(); } return; }
  if(a==='sellMode'){ SELL.mode=t.dataset.m; render(); window.scrollTo(0,0); return; }
  if(a==='addDeal'){ SELL.f.deals.push({t:'전세',p:'',r:''}); render(); return; }
  if(a==='delDeal'){ SELL.f.deals.splice(+t.dataset.k,1); render(); return; }
  if(a==='copyTpl'){ copy($('#tplBox').textContent,t); return; }
  if(a==='resetSell'){ SELL.f=emptyF(); SELL.step=0; SELL.editId=null; SELL.saved=null; SELL.paste=''; SELL.pasteMsg=''; SELL.filled=null; SELL.dirHint=''; render(); window.scrollTo(0,0); return; }
  if(a==='resetSeek'){ SEEK.step=0; SEEK.q=emptyQ(); SEEK.who={name:'',phone:'',people:'',movein:'',note:''}; SEEK.picks=[]; render(); window.scrollTo(0,0); return; }
  if(a==='clearFind'){ FIND.q={...emptyQ(),showAll:FIND.q.showAll}; render(); return; }
  if(a==='clFilter'){ CL.filter=t.dataset.k; render(); return; }
  if(a==='clientSearch'){ const c=S.C.find(x=>x.id===t.dataset.id); FIND.q={...clientQ(c),showAll:false}; location.hash='search'; return; }
  if(a==='saveListing'){ const doc=buildListing(); const f=SELL.f;
    if(SELL.editId){ const old=S.L.find(x=>x.id===SELL.editId)||{}; const upd={...doc,st:old.st||'active',d:todayISO()}; if(old.raw) upd.raw=old.raw; if(old.d0||old.d) upd.d0=old.d0||old.d; if(old.src) upd.src=old.src;
      const id=SELL.editId; if(await putRec('listings',{id,...upd},'수정했습니다')){ SELL.saved=id; SELL.savedDoc={id,...upd}; SELL.editId=null; render(); } return; }
    doc.raw=templateText(doc,f); doc.d0=doc.d; doc.src='응대 데스크 접수';
    const id='L'+Date.now().toString(36);
    if(await putRec('listings',{id,...doc},'매물장에 저장했습니다')){ SELL.saved=id; SELL.savedDoc={id,...doc}; render(); window.scrollTo(0,0); } return; }
  if(a==='saveClient'){ const w=SEEK.who, q=SEEK.q; if(!w.phone.trim()){ toast('연락처를 입력해 주세요'); document.getElementById('sk-phone2')?.focus(); return; }
    const doc={name:w.name.trim(),phone:w.phone.trim(),people:w.people,movein:w.movein,note:w.note,deal:q.deal,budget:parseMan(q.budget),budgetMin:parseMan(q.budgetMin),rentMax:q.rentMax===''?null:+q.rentMax,
      cats:q.cats,areas:q.areas,rooms:+q.rooms||0,baths:+q.baths||0,py:parseFloat(q.py)||null,kw:q.kw,elev:q.elev,park:q.park,pet:q.pet,needIns:q.needIns,lh:q.lh,shown:SEEK.picks,st:'waiting',d:todayISO(),src:'응대 데스크 접수'};
    Object.keys(doc).forEach(k=>{ if(doc[k]===null||doc[k]==='') delete doc[k]; });
    const id='C'+Date.now().toString(36);
    if(await putRec('clients',{id,...doc},'대기 손님으로 저장했습니다')){ SEEK.step=0; SEEK.q=emptyQ(); SEEK.who={name:'',phone:'',people:'',movein:'',note:''}; SEEK.picks=[]; location.hash='clients'; } return; }
});

/* ===== 관리자 설정: 구글 Apps Script 웹앱 주소를 따옴표 안에 넣으세요 ===== */
var CONFIG={ API_URL:'https://script.google.com/macros/s/AKfycby3XFNqjY8JBqJPtk6kN6MS65DwUJ6vbRY0i73Y3pK6vEa5HQYlBU7uaHCjW23Aa85v/exec' };
route();
loadAll();
</script>
