<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>매물장 응대 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: 상단 바 + 탭, 응대 마법사는 [단계 본문 | 실시간 매칭 패널] 2단, 좁으면 1단 */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E9EEF0; --ink:#15232A; --muted:#5A6A72; --line:#D8E0E3;
  --brand:#1D5768; --brand-ink:#FFFFFF; --brand-soft:#E1EDF0; --stamp:#BF3328; --stamp-soft:#FBE9E7;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --warn:#A8701A; --warn-soft:#FBF0DC; --violet:#6A4BA8; --violet-soft:#EEE8F8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-disp:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1619; --surface:#162125; --sunk:#1C2A2F; --ink:#E4ECEE; --muted:#93A4AB; --line:#2A393E;
  --brand:#6DB1C3; --brand-ink:#0B1416; --brand-soft:#1B3239; --stamp:#E6685E; --stamp-soft:#3A1F1C;
  --ok:#5FC28B; --ok-soft:#173226; --warn:#E2AA4C; --warn-soft:#352A15; --violet:#B39BEA; --violet-soft:#2A2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1619; --surface:#162125; --sunk:#1C2A2F; --ink:#E4ECEE; --muted:#93A4AB; --line:#2A393E;
  --brand:#6DB1C3; --brand-ink:#0B1416; --brand-soft:#1B3239; --stamp:#E6685E; --stamp-soft:#3A1F1C;
  --ok:#5FC28B; --ok-soft:#173226; --warn:#E2AA4C; --warn-soft:#352A15; --violet:#B39BEA; --violet-soft:#2A2340; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.mark{display:flex;align-items:baseline;gap:8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.mark b{font-family:var(--f-disp);font-size:22px;letter-spacing:-.5px}
.mark span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
main{padding-block:22px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:24px;letter-spacing:-.4px}
h2{font-size:19px;letter-spacing:-.3px}
h3{font-size:15px}
.sub{color:var(--muted);margin:4px 0 0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
/* home */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.door{display:flex;flex-direction:column;gap:10px;text-align:left;padding:24px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:inherit;min-width:0}
.door:hover{border-color:var(--brand)}
.door:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.door .k{font-family:var(--f-disp);font-size:26px;letter-spacing:-.6px}
.door .who{font-size:13px;font-weight:600;color:var(--brand)}
.door.sell .who{color:var(--stamp)}
.door ol{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.door .go{margin-top:auto;font-weight:600;color:var(--brand)}
.door.sell .go{color:var(--stamp)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.section{margin-top:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:16px;align-items:start}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px;font-weight:600}
.step.on{border-color:var(--brand);color:var(--ink);font-weight:600}
.step.on i{background:var(--brand);color:var(--brand-ink)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel + .panel{margin-top:14px}
.say{background:var(--brand-soft);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.say .lbl{color:var(--brand)}
.say p{margin:4px 0 0}
.tip{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.tip b{color:var(--warn)}
.checks{display:grid;gap:6px;margin:10px 0}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=tel],input[type=number],input[type=search],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.seg .chip{border-radius:8px;padding:9px 16px;font-weight:600}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.live .count{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.live .count small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.mini{display:grid;gap:8px;margin-top:12px}
.mini .it{padding:9px 10px;border-radius:8px;background:var(--sunk);font-size:13px;cursor:pointer}
.mini .it b{display:block;font-size:14px}
/* listing cards */
.results{display:grid;gap:10px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--brand)}
.card.pick{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.card .ttl{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:13px;grid-column:1/-1}
.card .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.card .rs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.price{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.pr{font-weight:700;font-size:15px}
.pr em{font-style:normal;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:4px;background:var(--sunk);color:var(--muted)}
.pr.S em{background:var(--stamp-soft);color:var(--stamp)}
.pr.J em{background:var(--brand-soft);color:var(--brand)}
.pr.M em{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:12px;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.hot{background:var(--stamp);color:#fff;font-weight:600}
.tag.good{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--stamp-soft);color:var(--stamp)}
.tag.unk{background:var(--warn-soft);color:var(--warn)}
.score{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.score.near{background:var(--warn-soft);color:var(--warn)}
.date{font-size:12px;color:var(--muted)}
.date.old{color:var(--warn);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
/* search layout */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
.filters .field{margin-top:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) 20px;border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;margin-top:12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
pre.raw{white-space:pre-wrap;word-break:break-word;background:var(--sunk);padding:12px;border-radius:8px;font-family:var(--f-body);font-size:13px;margin:8px 0 0;max-height:320px;overflow:auto}
.phone{font-weight:600;user-select:all}
.linkbtn{font:inherit;font-weight:700;background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
details.memo{margin-top:6px;font-size:13px}
details.memo summary{cursor:pointer;color:var(--brand);font-weight:600}
details.memo div{white-space:pre-wrap;background:var(--sunk);border-radius:6px;padding:8px 10px;margin-top:6px;color:var(--ink)}
.lockbox{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin-top:12px}
.secret{background:var(--stamp-soft);border-radius:6px;padding:2px 6px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:90vw}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.scrollx{overflow-x:auto}
.copybox{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;font-size:13px;margin-top:10px}
.deal-row{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
.hint{font-size:12px;color:var(--brand);font-weight:600;min-height:16px}
em.auto{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:4px}
.cxcard{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--brand-soft)}
details.panel summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
section > .panel + .panel, section > .panel + details, section > details + .panel{margin-top:14px}

/* 수수료 계산기 */
.calc-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;font:inherit;font-weight:700;font-size:14px;padding:12px 16px;border-radius:999px;border:0;background:var(--stamp);color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.calc{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.has-drawer .calc-fab{display:none}
@media (min-width:1000px){ .has-drawer .calc{right:calc(min(560px,100%) + 16px)} .has-drawer .calc-fab{display:block;right:calc(min(560px,100%) + 16px)} }
.calc .seg .chip{padding:6px 12px;font-size:13px}
.calc-big{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px;padding:12px;border-radius:10px;background:var(--stamp-soft)}
.calc-big span{font-size:13px;color:var(--muted)} .calc-big b{font-size:24px;color:var(--stamp)}
/* 계약 */
.feet td{vertical-align:middle} .feet input{max-width:160px} tr.off td{opacity:.45}
.feesum{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)} .feesum b{font-size:22px;color:var(--stamp)}
/* 일정 */
.mtitle{margin:18px 0 0;font-size:16px} .mcell.past{opacity:.55}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:180px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.day-h{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.day-h span{color:var(--muted)} .sun .day-h span,.sun .day-h b,.sun .mday .linkday{color:var(--stamp)} .sat .day-h span,.sat .day-h b,.sat .mday .linkday{color:var(--brand)}
.tdy{font-style:normal;font-size:11px;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:4px;padding:0 5px}
.addbtn{margin-left:auto;font:inherit;font-weight:700;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;line-height:1}
.addbtn:hover{border-color:var(--brand);color:var(--brand)}
.day-b{display:flex;flex-direction:column;gap:6px;padding:8px}
.none{font-size:12px;color:var(--muted)}
.ev{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;text-align:left;font:inherit;font-size:12px;width:100%;padding:6px 8px;border-radius:7px;border:0;border-left:3px solid var(--c,var(--muted));background:var(--cs,var(--sunk));color:var(--ink);cursor:pointer;min-width:0}
.ev:hover{filter:brightness(.97)}
.ev-t{font-weight:700;font-variant-numeric:tabular-nums}
.ev-k{font-weight:700;color:var(--c,var(--muted))}
.ev-n{flex-basis:100%;overflow-wrap:anywhere}
.ev-w{font-size:11px;color:var(--muted)}
.ev-done{opacity:.55} .ev-done .ev-n{text-decoration:line-through} .ev-cancel{opacity:.4}
.e-con{--c:var(--stamp);--cs:var(--stamp-soft)} .e-mid{--c:var(--warn);--cs:var(--warn-soft)} .e-bal{--c:var(--violet);--cs:var(--violet-soft)}
.e-show{--c:var(--brand);--cs:var(--brand-soft)} .e-meet{--c:var(--ok);--cs:var(--ok-soft)} .e-call,.e-etc{--c:var(--muted);--cs:var(--sunk)}
.elegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px}
.elegend .ev-k::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:1px}
.month{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead div{padding:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mcell{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell:nth-child(7n){border-right:0} .mcell.out{background:var(--sunk)} .mcell.out .linkday{opacity:.5}
.mcell.today{box-shadow:inset 0 0 0 2px var(--brand)}
.mday{display:flex;align-items:center} .mday .addbtn{width:20px;height:20px;font-size:12px;opacity:.6}
.linkday{font:inherit;font-size:12px;font-weight:700;background:none;border:0;cursor:pointer;color:var(--ink);padding:2px 4px}
.mcell .ev{padding:3px 5px;font-size:11px} .mcell .ev .ev-n{flex-basis:auto} .mcell .ev .ev-k{display:none}
.more{font:inherit;font-size:11px;background:none;border:0;color:var(--brand);cursor:pointer;text-align:left;padding:0 4px}
.elist{display:grid;gap:8px;margin-top:12px}
.erow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.ed{font-size:13px;font-weight:600;color:var(--muted);padding-top:6px} .ed.tdy2{color:var(--brand)}
.ecol{display:grid;gap:6px}
input[type=date],input[type=time]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
@media (max-width:900px){ .week{grid-template-columns:minmax(0,1fr)} .day{min-height:0} .mcell{min-height:70px} .mcell .ev .ev-n{display:none} }
@media (max-width:900px){
  .wiz,.split{grid-template-columns:minmax(0,1fr)}
  .live,.filters{position:static;max-height:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .doors{grid-template-columns:1fr}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .deal-row{grid-template-columns:1fr 1fr}
  .sync{display:none}
  header.top{position:static}
  .topin{gap:8px}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%}
  nav.tabs a{white-space:nowrap}
  .seg .chip{padding:7px 12px}
  .card{grid-template-columns:minmax(0,1fr)}
  .card .side{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <a class="mark" href="#home"><b>매물장</b><span>응대 데스크</span></a>
  <nav class="tabs" id="tabs">
    <a href="#seek" data-v="seek">집 보러 온 손님</a>
    <a href="#sell" data-v="sell">집 내놓는 손님</a>
    <a href="#search" data-v="search">매물 검색</a>
    <a href="#clients" data-v="clients">대기 손님</a>
    <a href="#schedule" data-v="schedule">일정</a>
    <a href="#deals" data-v="deals">계약·수수료</a>
    <a href="#setup" data-v="setup">설정</a>
  </nav>
  <div class="sync"><i class="dot" id="dot"></i><span id="syncTxt">불러오는 중</span></div>
</div></header>
<main class="wrap" id="main"></main>
<div id="layer"></div>
<div id="calcBox"></div>

<script>
'use strict';
/* ---------- 상수 ---------- */
const CATS=['아파트','빌라','오피스텔','단독·다가구','상가주택','상가·사무실','건물','토지','기타'];
const DEALS=['매매','전세','월세'];
const DK={매매:'S',전세:'J',월세:'M'};
const TAGS_SELL=['급매','공실','올수리','테라스','시스템에어컨','풀옵션','원룸','반지하','지층','옥탑','단독매물','신탁','위반건축물','권리금없음','분양권'];
const DIRS=['남향','남동향','남서향','동향','서향','북향','북동향','북서향'];
const S={L:[],C:[],E:[],K:[],db:null,live:false,view:'home'};
const today=new Date();

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function man(p){ if(p==null||p==='')return ''; p=+p; if(p>=10000){const e=Math.floor(p/10000),r=Math.round(p%10000);return e+'억'+(r?' '+r.toLocaleString():'');} return p.toLocaleString(); }
function dealTxt(d){ return d.t==='월세'?`${man(d.p)}/${d.r}`:man(d.p); }
/* "4억5천" "4.5억" "3천" "45000" → 만원 */
function parseMan(s){
  if(s==null)return null; s=String(s).replace(/[,\s원]/g,'').replace(/만$/,''); if(!s)return null;
  let v=0;
  if(s.includes('억')){const [a,b]=s.split('억'); v=parseFloat(a||'0')*10000; if(b) v+=restMan(b);}
  else v=restMan(s);
  return isNaN(v)?null:Math.round(v);
}
function restMan(b){ b=b.replace(/만$/,''); if(!b)return 0;
  if(b.includes('천')){const [x,y]=b.split('천'); let v=parseFloat(x||'1')*1000; if(y) v+=y.includes('백')?parseFloat(y)*100:parseFloat(y)||0; return v;}
  if(b.includes('백')) return parseFloat(b)*100;
  const n=parseFloat(b); return n; }
function ago(d){ if(!d)return 9999; return Math.floor((today-new Date(d))/86400000); }
function dshort(d){ return d? d.slice(2).replace(/-/g,'.'):''; }
function todayISO(){ const t=new Date(); return new Date(t-t.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
async function copy(txt,btn){ try{ await navigator.clipboard.writeText(txt); toast('복사했습니다'); }catch(e){ const box=btn&&btn.closest('.panel')?.querySelector('.copybox'); if(box){const r=document.createRange(); r.selectNodeContents(box); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast('텍스트를 선택해 두었습니다. Ctrl+C로 복사하세요'); } }
function title(l){ return l.name&&l.addr&&!l.addr.includes(l.name.split(' ')[0])? `${l.name} · ${l.addr}` : (l.addr||l.name||'(주소 미기재)'); }
function specs(l){ const a=[l.cat]; if(l.area)a.push(l.area); if(l.rooms!=null)a.push('방'+l.rooms+(l.baths!=null?'·화'+l.baths:'')); if(l.py)a.push(l.py+'평'); if(l.year)a.push(l.year+'년'); if(l.dir)a.push(l.dir);
  if(l.elev===true)a.push('엘베O'); if(l.elev===false)a.push('엘베X'); if(l.park===true)a.push('주차O'); if(l.park===false)a.push('주차X'); if(l.pet===false)a.push('반려동물X'); if(l.pet===true)a.push('반려동물O'); return a.join(' · '); }
function priceHTML(l){ if(!l.deals||!l.deals.length) return '<span class="pr"><em>?</em>거래조건 확인필요</span>'; return l.deals.map(d=>`<span class="pr ${DK[d.t]}"><em>${d.t}</em>${dealTxt(d)}</span>`).join(''); }

/* ---------- 매칭 엔진 ---------- */
const COMM=['상가·사무실','건물','토지'];
function emptyQ(){ return {deal:'',budget:'',budgetMin:'',rentMax:'',cats:[],areas:[],kw:'',rooms:0,baths:0,py:'',elev:false,park:false,pet:false,needIns:false,lh:false,hideOld:false,showAll:false,homeOnly:true}; }
function match(l,q){
  const showAll=q.showAll;
  if(!showAll && l.st!=='active') return null;
  const R=[]; let s=60, near=false;
  const ds=(l.deals||[]).filter(d=>!q.deal||d.t===q.deal);
  if(q.deal && !ds.length) return null;
  const B=parseMan(q.budget), Bmin=parseMan(q.budgetMin), RM=q.rentMax===''?null:+q.rentMax;
  if(B||RM){
    let best='over';
    for(const d of ds){
      let st='ok';
      if(d.t==='월세'){
        if(B && d.p>B) st = d.p<=B*1.2? 'near':'over';
        if(RM!=null && d.r>RM){ const n= d.r<=RM*1.15+5? 'near':'over'; st = st==='over'||n==='over'?'over':'near'; }
      } else if(B && d.p>B){ st = d.p<=B*1.1? 'near':'over'; }
      if(st==='ok'){best='ok';break;} if(st==='near') best='near';
    }
    if(!ds.length) best='ok';
    if(best==='over') return null;
    if(best==='near'){ near=true; s-=18; R.push(['예산 조금 초과','unk']); } else { s+=10; R.push(['예산 안','good']); }
    if(Bmin && ds.length && ds.every(d=>d.p<Bmin*0.7)){ s-=6; R.push(['예산보다 많이 저렴','unk']); }
  }
  if(q.cats.length && !q.cats.includes(l.cat)) return null;
  /* 종류를 정하지 않은 손님 = 집 구하는 손님 → 상가·건물·토지는 빼고 매칭 */
  if(!q.cats.length && q.homeOnly && COMM.includes(l.cat)) return null;
  if(q.areas.length){ if(!l.area){ s-=5; R.push(['지역 확인','unk']); } else if(!q.areas.includes(l.area)) return null; else { s+=6; } }
  const num=(k,label,unit)=>{ const want=+q[k]; if(!want) return true; if(l[k]==null){ s-=7; R.push([label+' 미확인','unk']); return true; } if(l[k]<want) return false; s+=8; R.push([label+l[k]+(unit||''),'good']); return true; };
  if(!num('rooms','방')) return null;
  if(!num('baths','화장실')) return null;
  const P=parseFloat(q.py); if(P){ if(l.py==null){ if(COMM.includes(l.cat)) return null; s-=5; R.push(['평수 미확인','unk']); } else if(l.py<P*0.85) return null; else { s+=5; R.push([l.py+'평','good']); } }
  const flag=(k,label)=>{ if(!q[k]) return true; if(l[k]===false) return false; if(l[k]===true){ s+=7; R.push([label+' 가능','good']); } else { s-=5; R.push([label+' 확인','unk']); } return true; };
  if(!flag('elev','엘베')) return null;
  if(!flag('park','주차')) return null;
  if(!flag('pet','반려동물')) return null;
  const tags=l.tags||[];
  if(q.needIns){ if(tags.some(t=>['보증보험불가','전세대출불가','위반건축물'].includes(t))) return null;
    if(tags.some(t=>['보증보험가능','안심전세가능','전세대출가능'].includes(t))){ s+=8; R.push(['보증보험·대출 가능','good']); } else { s-=4; R.push(['보증보험 확인','unk']); } }
  if(q.lh){ if(tags.includes('LH불가')) return null; if(tags.includes('LH협의')){s+=6;R.push(['LH 협의','good']);} else R.push(['LH 가능 여부 확인','unk']); }
  if(q.kw){ const hay=[l.name,l.addr,l.note,l.area,l.cat,(l.tags||[]).join(' '),l.raw].join(' ').toLowerCase().replace(/\s/g,'');
    for(const w of q.kw.toLowerCase().split(/[\s,]+/).filter(Boolean)) if(!hay.includes(w)) return null; s+=4; }
  const age=ago(l.d);
  if(age>365){ if(q.hideOld) return null; s-=15; R.push(['1년 넘음 · 진행 여부 확인','unk']); }
  else if(age<=60){ s+=8; R.push(['최근 접수','good']); }
  if(tags.includes('급매')) s+=3; if(tags.includes('올수리')) s+=3; if(tags.includes('공실')) s+=2;
  if(l.st!=='active') s-=30;
  return {s:Math.max(1,Math.min(99,Math.round(s))),R,near};
}
function runMatch(q,list){ list=list||S.L; const out=[]; for(const l of list){ const m=match(l,q); if(m) out.push({l,...m}); }
  out.sort((a,b)=>(a.near-b.near)||(b.s-a.s)||((b.l.d||'').localeCompare(a.l.d||''))); return out; }
function clientQ(c){ const q=emptyQ(); q.deal=c.deal||''; q.budget=c.budget??''; q.budgetMin=c.budgetMin??''; q.rentMax=c.rentMax??'';
  q.cats=c.cats||(c.cat?[c.cat]:[]); q.areas=c.areas||[]; q.rooms=c.rooms||0; q.baths=c.baths||0; q.py=c.py||''; q.kw=c.kw||'';
  q.elev=!!c.elev; q.park=!!c.park||(c.tags||[]).includes('주차필수'); q.pet=!!c.pet; q.needIns=!!c.needIns||(c.tags||[]).includes('보증보험필요'); q.lh=!!c.lh||(c.tags||[]).includes('LH');
  q.hideOld=true; return q; }
function clientsFor(l){ return S.C.filter(c=>c.st==='waiting').map(c=>({c,m:match(l,clientQ(c))})).filter(x=>x.m && !x.m.near).sort((a,b)=>b.m.s-a.m.s); }
function qSummary(q){ const a=[]; if(q.deal)a.push(q.deal); const B=parseMan(q.budget); if(B)a.push((q.deal==='월세'?'보증금 ':'')+man(B)+' 이하'); if(q.rentMax!=='')a.push('월 '+q.rentMax+' 이하');
  if(q.cats.length)a.push(q.cats.join('/')); if(q.areas.length)a.push(q.areas.join('/')); if(+q.rooms)a.push('방'+q.rooms+'+'); if(+q.baths)a.push('화'+q.baths+'+'); if(q.py)a.push(q.py+'평+');
  if(q.elev)a.push('엘베'); if(q.park)a.push('주차'); if(q.pet)a.push('반려동물'); if(q.needIns)a.push('보증보험'); if(q.lh)a.push('LH'); if(q.kw)a.push('"'+q.kw+'"'); return a.join(' · ')||'조건 없음'; }

/* ---------- 카드 ---------- */
function cardHTML(x,opt={}){ const l=x.l||x, m=x.s!=null?x:null; const age=ago(l.d);
  const stTag= l.st==='done'?'<span class="tag bad">거래완료</span>': l.st==='hold'?'<span class="tag unk">보류</span>':'';
  const tags=(l.tags||[]).map(t=>`<span class="tag ${t==='급매'?'hot':''}">${esc(t)}</span>`).join('');
  return `<button class="card ${opt.pick?'pick':''}" data-act="open" data-id="${l.id}">
    <div class="ttl">${esc(title(l))}</div>
    <div class="side">${m?`<span class="score ${m.near?'near':''}">${m.near?'근접':'일치'} ${m.s}</span>`:''}<span class="date ${age>365?'old':''}">${dshort(l.d0||l.d)} 등록${l.d0&&l.d&&l.d!==l.d0?' · '+dshort(l.d)+' 확인':''}</span></div>
    <div class="price">${priceHTML(l)}</div>
    <div class="meta">${esc(specs(l))}${l.note?' — '+esc(l.note):''}</div>
    <div class="rs">${stTag}${tags}${m?m.R.map(r=>`<span class="tag ${r[1]}">${esc(r[0])}</span>`).join(''):''}</div>
  </button>`; }

/* ---------- 필터 컨트롤 (보러온 손님 / 검색 공용) ---------- */
function areasList(){ const c={}; S.L.forEach(l=>{ if(l.area) c[l.area]=(c[l.area]||0)+1; }); return Object.keys(c).sort((a,b)=>c[b]-c[a]); }
function chipsHTML(scope,key,opts,sel,multi){ return `<div class="chips ${multi?'':'seg'}">`+opts.map(o=>{ const on= multi? sel.includes(o): sel===o; return `<button class="chip ${on?'on':''}" data-scope="${scope}" data-chip="${key}" data-val="${esc(o)}" data-multi="${multi?1:0}">${esc(o)}</button>`; }).join('')+`</div>`; }
function dealFields(scope,q){
  const isM=q.deal==='월세';
  return `<div class="field"><span>거래 종류</span>${chipsHTML(scope,'deal',DEALS,q.deal,false)}</div>
  <div class="fgrid">
    <label class="field"><span>${isM?'보증금 최대':(q.deal==='매매'?'매매가 최대':'전세금 최대')}</span><input type="text" id="${scope}-budget" data-scope="${scope}" data-q="budget" value="${esc(q.budget)}" placeholder="예: 2억5천, 25000"><span class="hint" id="${scope}-budget-h">${parseMan(q.budget)?man(parseMan(q.budget))+' 만원':''}</span></label>
    ${isM?`<label class="field"><span>월세 최대 (만원)</span><input type="number" id="${scope}-rent" data-scope="${scope}" data-q="rentMax" value="${esc(q.rentMax)}" placeholder="예: 60"></label>`
      :`<label class="field"><span>최소 금액 (선택)</span><input type="text" id="${scope}-bmin" data-scope="${scope}" data-q="budgetMin" value="${esc(q.budgetMin)}" placeholder="예: 1억"><span class="hint" id="${scope}-budgetMin-h">${parseMan(q.budgetMin)?man(parseMan(q.budgetMin))+' 만원':''}</span></label>`}
  </div>`;
}
function homeFields(scope,q){
  return `<div class="field"><span>집 종류 (여러 개 선택 가능${scope==='search'?', 안 고르면 전체':' · 안 고르면 주거용만 · 상가 손님은 상가·사무실 선택'})</span>${chipsHTML(scope,'cats',CATS,q.cats,true)}</div>
  <div class="field" style="margin-top:12px"><span>지역 (안 고르면 전체)</span>${chipsHTML(scope,'areas',areasList(),q.areas,true)}</div>
  <div class="fgrid">
    <label class="field"><span>방 최소</span><select id="${scope}-rooms" data-scope="${scope}" data-q="rooms">${[0,1,2,3,4].map(n=>`<option value="${n}" ${+q.rooms===n?'selected':''}>${n?n+'개 이상':'상관없음'}</option>`).join('')}</select></label>
    <label class="field"><span>화장실 최소</span><select id="${scope}-baths" data-scope="${scope}" data-q="baths">${[0,1,2].map(n=>`<option value="${n}" ${+q.baths===n?'selected':''}>${n?n+'개 이상':'상관없음'}</option>`).join('')}</select></label>
    <label class="field"><span>평수 최소 (평)</span><input type="number" id="${scope}-py" data-scope="${scope}" data-q="py" value="${esc(q.py)}" placeholder="예: 15"></label>
    <label class="field"><span>단지·동네·키워드</span><input type="text" id="${scope}-kw" data-scope="${scope}" data-q="kw" value="${esc(q.kw)}" placeholder="예: 양우, 신일, 테라스"></label>
  </div>
  <div class="field" style="margin-top:12px"><span>꼭 필요한 것</span>
    <div class="checks">
      ${[['elev','엘리베이터'],['park','주차'],['pet','반려동물 가능'],['needIns','전세대출·보증보험(HUG 안심전세) 필요'],['lh','LH 전세']].map(([k,t])=>`<label><input type="checkbox" id="${scope}-${k}" data-scope="${scope}" data-qc="${k}" ${q[k]?'checked':''}> ${t}</label>`).join('')}
      <label><input type="checkbox" id="${scope}-hideOld" data-scope="${scope}" data-qc="hideOld" ${q.hideOld?'checked':''}> 1년 넘은 매물 숨기기</label>
    </div></div>`;
}

/* ---------- 홈 ---------- */
function viewHome(){
  const act=S.L.filter(l=>l.st==='active'); const cnt=t=>act.filter(l=>(l.deals||[]).some(d=>d.t===t)).length;
  const recent=[...act].sort(byNewest).slice(0,6);
  const wait=S.C.filter(c=>c.st==='waiting');
  return `${!isShared()?`<div class="tip" style="margin:0 0 16px"><b>공유 연결 전</b> 지금은 이 컴퓨터에만 저장됩니다. 직원들과 같은 매물장을 쓰려면 <a href="#setup">설정</a>에서 비밀번호를 입력하세요.</div>`:''}<h1>어떤 손님이 오셨나요?</h1><p class="sub">고르면 순서대로 안내합니다. 처음 응대하는 직원도 화면의 멘트와 질문을 따라가면 됩니다.</p>
  <div class="doors">
    <button class="door" data-go="seek"><span class="who">매수 · 임차 손님</span><span class="k">집 보러 왔어요</span>
      <ol><li>인사하고 무엇을 찾는지 파악</li><li>거래 종류·예산 확인</li><li>원하는 집 조건 확인</li><li>우리 매물에서 바로 추천</li><li>연락처 받고 대기 손님으로 등록</li></ol><span class="go">응대 시작 →</span></button>
    <button class="door sell" data-go="sell"><span class="who">매도 · 임대 손님</span><span class="k">집 내놓으러 왔어요</span>
      <ol><li>소유자 본인 확인, 연락처</li><li>주소·거래 종류·희망가</li><li>구조·옵션·주차 등 상세</li><li>입주일·세입자·권리관계</li><li>매물장 저장 → 기다리던 손님 바로 확인</li></ol><span class="go">접수 시작 →</span></button>
  </div>
  <div class="stats">
    <div class="stat"><b>${act.length}</b><span>진행 중 매물</span></div>
    <div class="stat"><b>${cnt('매매')} / ${cnt('전세')} / ${cnt('월세')}</b><span>매매 / 전세 / 월세</span></div>
    <div class="stat"><b>${act.filter(l=>ago(l.d)<=90).length}</b><span>최근 3개월 접수</span></div>
    <div class="stat"><b>${wait.length}</b><span>대기 손님</span></div>
  </div>
  <div class="section"><div class="row" style="justify-content:space-between"><h2>이번 주 일정</h2><div class="row"><button class="btn sm pri" data-act="newEvent" data-date="${todayISO()}">+ 일정 추가</button><a class="btn sm" href="#schedule">일정 전체</a></div></div>${upcomingHTML(7)}</div>
  <div class="section"><div class="row" style="justify-content:space-between"><h2>최근 접수 매물</h2><a class="btn sm" href="#search">전체 매물 보기</a></div>
  <div class="results">${recent.length?recent.map(l=>cardHTML(l)).join(''):emptyState()}</div></div>`;
}
function emptyState(){ return S.live? `<div class="empty">아직 매물이 없습니다. <b>집 내놓는 손님</b> 탭에서 첫 매물을 접수해 보세요.</div>` : `<div class="empty">매물장을 불러오는 중입니다…</div>`; }

/* ---------- 보러 온 손님 마법사 ---------- */
const SEEK={step:0,q:emptyQ(),who:{name:'',phone:'',people:'',movein:'',note:''},picks:[]};
const SEEK_STEPS=['인사·파악','거래·예산','집 조건','매물 추천','마무리'];
function viewSeek(){
  const st=SEEK.step;
  const steps=`<div class="steps">${SEEK_STEPS.map((t,i)=>`<button class="step ${i===st?'on':i<st?'done':''}" data-seekstep="${i}"><i>${i<st?'✓':i+1}</i>${t}</button>`).join('')}</div>`;
  let body='';
  if(st===0) body=`<h2>1. 인사하고 무엇을 찾는지 파악</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"안녕하세요, 어서 오세요. 이쪽에 앉으세요. 어떤 집 알아보고 계세요? 사실 분인지, 전세나 월세로 들어가실 분인지 먼저 여쭤봐도 될까요?"</p></div>
    <div class="fgrid">
      <label class="field"><span>손님 성함</span><input type="text" id="sk-name" data-who="name" value="${esc(SEEK.who.name)}" placeholder="예: 김OO"></label>
      <label class="field"><span>연락처</span><input type="tel" id="sk-phone" data-who="phone" value="${esc(SEEK.who.phone)}" placeholder="010-0000-0000"></label>
      <label class="field"><span>거주 인원·가족 구성</span><input type="text" id="sk-people" data-who="people" value="${esc(SEEK.who.people)}" placeholder="예: 부부+아이1, 혼자"></label>
      <label class="field"><span>이사 희망 시기</span><input type="text" id="sk-movein" data-who="movein" value="${esc(SEEK.who.movein)}" placeholder="예: 12월 중순, 3/15 만기"></label>
    </div>
    <div class="tip"><b>확인 포인트</b> 지금 사는 집이 언제 비는지(만기), 현재 집을 내놓아야 하는지도 물어보세요. 내놓을 집이 있으면 "집 내놓는 손님"으로도 접수합니다.</div>`;
  if(st===1) body=`<h2>2. 거래 종류와 예산</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"예산은 어느 정도로 생각하세요? 대출을 받으실 계획이면 전세대출이나 보증보험이 되는 집으로 골라 드릴게요."</p></div>
    ${dealFields('seek',SEEK.q)}
    <div class="tip"><b>확인 포인트</b> 전세라면 <b>전세대출·HUG 안심전세(보증보험)</b> 필요 여부, LH 전세인지 꼭 물어보세요. 필요하면 다음 단계에서 체크하세요. 금액은 "2억5천", "25000" 어느 쪽으로 써도 됩니다.</div>`;
  if(st===2) body=`<h2>3. 원하는 집 조건</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"방은 몇 개 필요하세요? 엘리베이터나 주차, 반려동물처럼 꼭 있어야 하는 조건이 있을까요? 선호하시는 동네나 단지도 말씀해 주세요."</p></div>
    ${homeFields('seek',SEEK.q)}
    <div class="tip"><b>요령</b> 처음엔 조건을 넓게 잡고, 오른쪽 숫자가 너무 많으면 하나씩 좁히세요. "꼭 필요한 것"만 체크합니다.</div>`;
  if(st===3){ const res=runMatch(SEEK.q);
    body=`<h2>4. 우리 매물 추천</h2><p class="sub">${esc(qSummary(SEEK.q))}</p>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"말씀하신 조건으로 저희가 가진 집이 ${res.filter(x=>!x.near).length}개 있어요. 먼저 이 집들 보여 드릴게요. 마음에 드시는 곳은 바로 집주인께 연락해서 보러 가실 수 있게 해 드릴게요."</p></div>
    <div class="tip"><b>보여주기 전</b> ① 집주인·세입자에게 전화해 아직 나와 있는지, 가격 변동 없는지 확인 ② 방문 시간 약속 ③ 1년 넘은 매물은 꼭 진행 여부 먼저 확인. 카드를 누르면 연락처와 원문이 나옵니다. 보여줄 집은 상세 화면에서 <b>"보여줄 집에 담기"</b>.</div>
    ${SEEK.picks.length?`<h3 style="margin-top:14px">보여줄 집 ${SEEK.picks.length}곳</h3><div class="results">${SEEK.picks.map(id=>S.L.find(l=>l.id===id)).filter(Boolean).map(l=>cardHTML(l,{pick:1})).join('')}</div><h3 style="margin-top:18px">전체 추천</h3>`:''}
    <div class="results">${res.length?res.slice(0,60).map(x=>cardHTML(x,{pick:SEEK.picks.includes(x.l.id)})).join(''):`<div class="empty">조건에 맞는 매물이 없습니다. 예산이나 조건을 조금 넓혀 보거나, 마무리 단계에서 대기 손님으로 등록하세요.</div>`}</div>
    ${res.length>60?`<p class="sub">상위 60건만 표시했습니다. 조건을 좁혀 보세요.</p>`:''}`; }
  if(st===4) body=`<h2>5. 마무리 · 대기 손님 등록</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"오늘 보신 집 외에도 조건에 맞는 집이 새로 들어오면 바로 연락드릴게요. 연락처 한 번만 확인할게요."</p></div>
    <div class="fgrid">
      <label class="field"><span>손님 성함</span><input type="text" id="sk-name2" data-who="name" value="${esc(SEEK.who.name)}"></label>
      <label class="field"><span>연락처 <small>(필수)</small></span><input type="tel" id="sk-phone2" data-who="phone" value="${esc(SEEK.who.phone)}" placeholder="010-0000-0000"></label>
      <label class="field full"><span>메모 (상담 내용, 다음 연락 약속 등)</span><textarea id="sk-note" data-who="note" placeholder="예: 토요일 오후 재방문, 소사초 근처 원함">${esc(SEEK.who.note)}</textarea></label>
    </div>
    <p class="sub">저장되는 조건: ${esc(qSummary(SEEK.q))}${SEEK.who.movein?' · 이사 '+esc(SEEK.who.movein):''}${SEEK.picks.length?' · 보여준 집 '+SEEK.picks.length+'곳':''}</p>
    <div class="checks"><label><input type="checkbox" id="sk-c1"> 명함 드렸음</label><label><input type="checkbox" id="sk-c2"> 다음 연락 날짜 약속함</label><label><input type="checkbox" id="sk-c3"> 내놓을 집 있으면 매물 접수 안내함</label></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="saveClient">대기 손님으로 저장</button><button class="btn ghost" data-act="resetSeek">새 손님 응대</button></div>`;
  const res=runMatch(SEEK.q); const exact=res.filter(x=>!x.near);
  const side=`<aside class="panel live"><div class="lbl">실시간 매칭</div>
    <div class="count">${exact.length}<small> 건 일치</small></div>
    <p class="sub" style="font-size:13px">${res.length-exact.length? `예산 조금 넘는 집 ${res.length-exact.length}건 더 있음 · `:''}${esc(qSummary(SEEK.q))}</p>
    <div class="mini">${res.slice(0,5).map(x=>`<div class="it" data-act="open" data-id="${x.l.id}"><b>${esc(title(x.l))}</b>${x.l.deals.map(d=>d.t+' '+dealTxt(d)).join(' · ')}</div>`).join('')||'<p class="sub">조건을 입력하면 여기에 바로 나옵니다.</p>'}</div>
    ${res.length?`<button class="btn sm" style="margin-top:10px" data-seekstep="3">추천 목록 전체 보기</button>`:''}</aside>`;
  return `<div class="row" style="justify-content:space-between"><div><h1>집 보러 온 손님</h1><p class="sub">순서대로 물어보면 오른쪽에 우리 매물이 바로 걸러집니다.</p></div><button class="btn ghost sm" data-act="resetSeek">처음부터</button></div>${steps}
  <div class="wiz"><section class="panel">${body}
    <div class="navbar"><button class="btn" data-seekstep="${st-1}" ${st===0?'disabled':''}>← 이전</button>${st<4?`<button class="btn pri" data-seekstep="${st+1}">다음: ${SEEK_STEPS[st+1]} →</button>`:''}</div></section>${side}</div>`;
}

/* ---------- 내놓는 손님 마법사 (매물 접수) ---------- */
function emptyF(){ return {role:'소유자',ownerName:'',phone:'',carrier:'',phone2:'',phone2Who:'세입자',cat:'',deals:[{t:'매매',p:'',r:''}],name:'',addr:'',area:'',year:'',py:'',rooms:'',baths:'',dir:'',fee:'',elev:'',park:'',pet:'',options:'',movein:'',tenant:'',show:'',loan:'',ins:'',ad:'광고 가능',excl:'',fee2:'',note:'',tags:[],sup:'',ex:'',dongho:'',ltype:'우리 매물',coop:'',coopTel:'',url:''}; }
const SELL={step:0,f:emptyF(),editId:null,saved:null,mode:'quick'};
const SELL_STEPS=['인사·본인 확인','매물 기본','상세 정보','일정·권리관계','확인·저장'];
function sel(id,key,opts,val){ return `<select id="${id}" data-f="${key}"><option value="">선택</option>${opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
function inp(id,key,val,ph,type){ return `<input type="${type||'text'}" id="${id}" data-f="${key}" value="${esc(val)}" placeholder="${esc(ph||'')}">`; }
function fchips(key,opts,val,multi){ return `<div class="chips ${multi?'':'seg'}">`+opts.map(o=>{const on=multi?val.includes(o):val===o; return `<button class="chip ${on?'on':''}" data-fchip="${key}" data-val="${esc(o)}" data-multi="${multi?1:0}">${esc(o)}</button>`;}).join('')+`</div>`; }
function sellStep(i){ const f=SELL.f;
  if(i===0) return `<h2>1. 인사하고 본인 확인</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"안녕하세요, 집 내놓으시려고요? 집주인 되시나요? 연락 받으실 번호부터 적어 둘게요."</p></div>
    <div class="field"><span>누가 내놓나요</span>${fchips('role',['소유자','배우자·가족','세입자','대리인'],f.role)}</div>
    <div class="fgrid">
      <label class="field"><span>성함</span>${inp('f-owner','ownerName',f.ownerName,'예: 김OO')}</label>
      <label class="field"><span>연락처</span>${inp('f-phone','phone',f.phone,'010-0000-0000','tel')}</label>
      <label class="field"><span>통신사</span>${sel('f-carrier','carrier',['SKT','KT','LG U+','알뜰폰'],f.carrier)}</label>
      <label class="field"><span>추가 연락처 (세입자 등)</span>${inp('f-phone2','phone2',f.phone2,'집 보여줄 사람 번호','tel')}</label>
    </div>
    ${SELL.editId&&!canSee()?'<div class="tip"><b>🔒 연락처 수정 불가</b> 기존 매물의 연락처·현관 비밀번호는 열람 비밀번호를 입력해야 보이고 고칠 수 있습니다. 여기 비워 두면 기존 값이 그대로 유지됩니다.</div>':''}
    <div class="tip"><b>확인 포인트</b> 소유자가 아니면 소유자 성함·연락처도 받고, 대리인은 계약할 때 <b>위임장·인감증명서</b>가 필요하다고 안내하세요. 모르는 번호를 안 받는 분은 "문자 먼저"라고 메모합니다.</div>`;
  if(i===1) return `<h2>2. 매물 기본 정보</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"주소랑 동·호수 알려 주시겠어요? 매매로 내놓으세요, 전세나 월세로 내놓으세요? 생각하시는 금액은 얼마세요?"</p></div>
    <div class="field"><span>집 종류</span>${fchips('cat',CATS,f.cat)}</div>
    <div class="fgrid">
      <label class="field full"><span>주소 · 동호수</span>${inp('f-addr','addr',f.addr,'예: 소사본동 219-24 진영리더스빌 1동 303호')}</label>
      <label class="field"><span>단지·건물 이름</span>${inp('f-name','name',f.name,'예: 양우, 신일해피트리')}</label>
      <label class="field"><span>동네</span><input type="text" id="f-area" data-f="area" list="areaList" value="${esc(f.area)}" placeholder="예: 소사본동"><datalist id="areaList">${areasList().map(a=>`<option value="${esc(a)}">`).join('')}</datalist></label>
    </div>
    <div class="field" style="margin-top:14px"><span>거래 조건 (여러 개 가능: 매매 안 되면 전세 등)</span>
      ${f.deals.map((d,k)=>`<div class="deal-row">
        <select id="f-dt-${k}" data-deal="${k}" data-dk="t">${DEALS.map(t=>`<option ${d.t===t?'selected':''}>${t}</option>`).join('')}</select>
        <label class="field"><input type="text" id="f-dp-${k}" data-deal="${k}" data-dk="p" value="${esc(d.p)}" placeholder="${d.t==='월세'?'보증금 예: 2000':'금액 예: 4억5천'}"><span class="hint" id="f-dp-${k}-h">${parseMan(d.p)?man(parseMan(d.p))+' 만원':''}</span></label>
        ${d.t==='월세'?`<label class="field"><input type="number" id="f-dr-${k}" data-deal="${k}" data-dk="r" value="${esc(d.r)}" placeholder="월세 (만원)"><span class="hint"></span></label>`:'<span></span>'}
        <button class="btn ghost sm" data-act="delDeal" data-k="${k}" ${f.deals.length<2?'disabled':''}>삭제</button></div>`).join('')}
      <div><button class="btn sm" data-act="addDeal" style="margin-top:8px">+ 거래 조건 추가</button></div></div>
    <div class="tip"><b>확인 포인트</b> "얼마까지 조정 가능하세요?"를 꼭 물어보고 마지막 단계 메모에 적으세요. 급하게 파는 집이면 <b>급매</b> 표시를 합니다.</div>`;
  if(i===2) return `<h2>3. 구조 · 상세 정보</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"몇 년도에 지어진 집이에요? 방이랑 화장실은 몇 개고, 수리한 곳이 있을까요? 주차랑 엘리베이터도 확인할게요."</p></div>
    <div class="fgrid">
      <label class="field"><span>연식 (준공 연도)</span>${inp('f-year','year',f.year,'예: 2019','number')}</label>
      <label class="field"><span>평수 (전용, 평)</span>${inp('f-py','py',f.py,'예: 18','number')}<small>공급/전용 둘 다 알면 메모에 같이 적기</small></label>
      <label class="field"><span>방</span>${inp('f-rooms','rooms',f.rooms,'예: 3','number')}</label>
      <label class="field"><span>화장실</span>${inp('f-baths','baths',f.baths,'예: 2','number')}</label>
      <label class="field"><span>향 (거실 기준)</span>${sel('f-dir','dir',DIRS,f.dir)}</label>
      <label class="field"><span>관리비</span>${inp('f-fee','fee',f.fee,'예: 6만원, 없음')}</label>
    </div>
    <div class="fgrid">
      <div class="field"><span>엘리베이터</span>${fchips('elev',['있음','없음'],f.elev)}</div>
      <div class="field"><span>주차</span>${fchips('park',['가능','불가'],f.park)}</div>
      <div class="field"><span>반려동물</span>${fchips('pet',['가능','불가'],f.pet)}</div>
    </div>
    <label class="field" style="margin-top:12px"><span>옵션 · 수리 내역</span><textarea id="f-options" data-f="options" placeholder="예: 시스템에어컨 2대, 붙박이장, 22년 올수리(샷시 제외)">${esc(f.options)}</textarea></label>
    <div class="field" style="margin-top:12px"><span>특징 표시</span>${fchips('tags',TAGS_SELL,f.tags,true)}</div>`;
  if(i===3) return `<h2>4. 입주 일정 · 권리관계</h2>
    <div class="say"><div class="lbl">이렇게 말하세요</div><p>"언제부터 들어올 수 있어요? 지금 세입자가 살고 있나요? 집 보여 드릴 때는 어떻게 하면 될까요? 대출(근저당)이 잡혀 있는지도 여쭤볼게요."</p></div>
    <div class="fgrid">
      <label class="field"><span>입주 가능일</span>${inp('f-movein','movein',f.movein,'예: 즉시, 12월 중순 협의')}</label>
      <label class="field"><span>현재 거주</span>${sel('f-tenant','tenant',['공실','소유자 거주','세입자 거주'],f.tenant)}</label>
      <label class="field full"><span>집 보는 방법 · 현관 비밀번호 🔒</span>${inp('f-show','show',f.show,'예: 현관 #1234# / 평일 6시 이후, 방문 전 세입자에게 문자')}<small>현관 비밀번호는 꼭 이 칸에 적으세요. 열람 비밀번호를 입력한 직원에게만 보입니다.</small></label>
      <label class="field"><span>근저당 · 융자</span>${sel('f-loan','loan',['없음','있음','신탁','모름'],f.loan)}</label>
      <label class="field"><span>전세대출 · 보증보험</span>${sel('f-ins','ins',['가능','불가','확인 필요'],f.ins)}</label>
      <label class="field"><span>네이버 광고</span>${sel('f-ad','ad',['광고 가능','광고 안 함'],f.ad)}</label>
      <label class="field"><span>우리에게만 내놓음</span>${sel('f-excl','excl',['단독','여러 곳'],f.excl)}</label>

  if(nm&&!/^(이름|연락처|통신사|임대인|임차인|세입자|소유자|주인|관리|관리인|아내|남편|부인|아들|딸|사모님)$/.test(nm[1])) f.ownerName=nm[1];
  if(/임차인|세입자/.test(l8)) f.role='세입자';
  /* 네이버 부동산 매물 화면 글자 */
  const url=T.match(/https?:\/\/\S*(?:naver\.me|land\.naver\.com)\S*/); if(url) f.url=url[0];
  if(!f.ex){ const ex=T.match(/전용\s*([0-9]+(?:\.[0-9]+)?)/); if(ex){ f.ex=ex[1]; } }
  if(!f.sup){ const sp=T.match(/([0-9]+(?:\.[0-9]+)?)[A-Za-z]?\s*(?:㎡|m²|m2)/); if(sp&&(!f.ex||+sp[1]>+f.ex)) f.sup=sp[1]; }
  if((f.sup||f.ex)&&!f.py) f.py=String(pyOf(+(f.sup||f.ex)));
  const fl=T.match(/(\d{1,2}|저|중|고)\s*\/\s*(\d{1,2})\s*층/);
  if(!f.dir){ const d=T.match(/(남동|남서|북동|북서|남|북|동|서)\s*향/); if(d) f.dir=d[1]+'향'; }
  if(!f.dongho&&cx){ const dn=T.replace(/01[0-9][\s\d-]+/g,' ').match(/(\d{2,4})\s*동(?![가-힣])/); if(dn) f.dongho=`${dn[1]}동`+(fl?` ${fl[1]}층`:''); }
  if(fl) f.note=[f.note,`${fl[1]}/${fl[2]}층`].filter(Boolean).join(' / ');
  const br=T.match(/([가-힣A-Za-z0-9]{2,20}(?:공인중개사사무소|공인중개사|부동산중개|부동산))/);
  const tel=T.match(/0(?:2|3[1-3]|4[1-4]|5[1-5]|6[1-4]|70)[\s-]?\d{3,4}[\s-]?\d{4}/);
  if(f.url||br){ if(br) f.coop=br[1]; if(tel) f.coopTel=tel[0].replace(/\s/g,'-'); f.ltype='공동중개 매물';
    if(!line(8)&&f.phone&&!f.coopTel){ f.coopTel=f.phone; delete f.phone; delete f.ownerName; delete f.carrier; } }

}
function applyParsed(p){ const F=SELL.f; const filled=[];
  for(const [k,v] of Object.entries(p.f)){ if(v==null||v==='') continue; if(k==='deals'){ F.deals=v; filled.push('deals'); continue; } F[k]=v; filled.push(k); }
  if(p.cx) applyComplex(p.cx,F,false);
  if(p.cx&&F.sup){ const t=(p.cx.types||[]).find(t=>t.sup&&Math.abs(t.sup-(+F.sup))<1.5); if(t) applyType(t,F,false); }
  SELL.filled=new Set(filled); autoDir(false); return filled.length; }

function buildListing(){ const f=SELL.f;

  if(f.ins==='가능'&&!tags.includes('보증보험가능')) tags.push('보증보험가능');
  if(f.ins==='불가'&&!tags.includes('보증보험불가')) tags.push('보증보험불가');
  if(f.loan==='신탁'&&!tags.includes('신탁')) tags.push('신탁');

/* ---------- 저장소: 구글 시트 (Apps Script 웹앱) ----------
   시트 한 줄 = 매물 하나 / 손님 하나. 시트에서 직접 고쳐도 됩니다.
   거래조건 칸 형식: "매매 45000 / 전세 38000 / 월세 3000/60" (단위: 만원) */
const LCOLS=[['id','ID'],['st','상태'],['d','최근확인일'],['d0','최초접수일'],['cat','종류'],['deals','거래조건'],['name','단지·건물'],['addr','주소'],['area','동네'],['rooms','방'],['baths','화장실'],['py','평수'],['year','연식'],['dir','향'],['elev','엘베'],['park','주차'],['pet','반려동물'],['tags','특징'],['note','메모'],['phones','연락처'],['owner','내놓은분'],['show','집보는법'],['raw','원문'],['src','출처'],['coop','상대부동산'],['coopTel','상대부동산연락처'],['url','네이버링크']];
const CCOLS=[['id','ID'],['st','상태'],['d','접수일'],['name','성함'],['phone','연락처'],['deal','거래'],['budget','예산최대'],['budgetMin','예산최소'],['rentMax','월세최대'],['cats','종류'],['areas','동네'],['rooms','방최소'],['baths','화장실최소'],['py','평수최소'],['kw','키워드'],['need','필수조건'],['people','인원'],['movein','이사시기'],['note','메모'],['shown','보여준매물'],['raw','원문'],['src','출처'],['memo','상담메모']];
const LST={active:'진행중',hold:'보류',done:'거래완료'}, CST={waiting:'대기중',done:'계약완료',hold:'보류'};
const NEEDS=[['elev','엘베'],['park','주차'],['pet','반려동물'],['needIns','보증보험'],['lh','LH']];
const inv=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
const list=v=>String(v??'').split(/\s*,\s*/).map(s=>s.trim()).filter(Boolean);
const numOr=v=>{ if(v===''||v==null) return undefined; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?undefined:n; };
function normDate(v){ v=String(v||'').trim(); const m=v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : ''; }
function parseDeals(s){ const out=[]; const re=/(매매|전세|월세|반전세)\s*([0-9][0-9,.억천]*)(?:\s*\/\s*([0-9]+))?/g; let m;
  while((m=re.exec(String(s||'')))){ const t=m[1]==='반전세'?'월세':m[1]; const p=parseMan(m[2]); if(!p) continue; const d={t,p}; if(t==='월세') d.r=+(m[3]||0); out.push(d); } return out; }
const dealsStr=ds=>(ds||[]).map(d=>`${d.t} ${d.p}${d.t==='월세'?'/'+(d.r||0):''}`).join(' / ');
const ox=v=>v===true?'O':v===false?'X':'';
const fromOx=v=>{ v=String(v||'').trim().toUpperCase(); return v==='O'||v==='0'||v==='○'||v==='가능'||v==='있음'?true: v==='X'||v==='불가'||v==='없음'?false: undefined; };
function fromRowL(o){ const r={}; LCOLS.forEach(([k,h])=>r[k]=o[h]??'');
  const l={id:String(r.id),st:inv(LST)[r.st]||'active',d:normDate(r.d),d0:normDate(r.d0),cat:r.cat||'기타',deals:parseDeals(r.deals),
    name:r.name,addr:r.addr,area:r.area,rooms:numOr(r.rooms),baths:numOr(r.baths),py:numOr(r.py),year:numOr(r.year),dir:r.dir,
    elev:fromOx(r.elev),park:fromOx(r.park),pet:fromOx(r.pet),tags:list(r.tags),note:r.note,phones:list(r.phones),owner:r.owner,show:r.show,raw:r.raw,src:r.src,coop:r.coop,coopTel:r.coopTel,url:r.url};
  if(o._locked) l.locked=list(o._locked);
  Object.keys(l).forEach(k=>{ if(l[k]===undefined||l[k]==='') delete l[k]; }); if(!l.tags) l.tags=[]; return l; }
function toRowL(l){ const r={id:l.id,st:LST[l.st]||'진행중',d:l.d||'',d0:l.d0||'',cat:l.cat||'',deals:dealsStr(l.deals),name:l.name||'',addr:l.addr||'',area:l.area||'',
    rooms:l.rooms??'',baths:l.baths??'',py:l.py??'',year:l.year??'',dir:l.dir||'',elev:ox(l.elev),park:ox(l.park),pet:ox(l.pet),tags:(l.tags||[]).join(', '),
    note:l.note||'',phones:(l.phones||[]).join(', '),owner:l.owner||'',show:l.show||'',raw:l.raw||'',src:l.src||'',coop:l.coop||'',coopTel:l.coopTel||'',url:l.url||''};
  const o={}; LCOLS.forEach(([k,h])=>o[h]=String(r[k]??'')); return o; }
function fromRowC(o){ const r={}; CCOLS.forEach(([k,h])=>r[k]=o[h]??''); const need=list(r.need);
  const c={id:String(r.id),st:inv(CST)[r.st]||'waiting',d:normDate(r.d),name:r.name,phone:r.phone,deal:r.deal,budget:numOr(parseMan(r.budget)),budgetMin:numOr(parseMan(r.budgetMin)),rentMax:numOr(r.rentMax),
    cats:list(r.cats),areas:list(r.areas),rooms:numOr(r.rooms),baths:numOr(r.baths),py:numOr(r.py),kw:r.kw,people:r.people,movein:r.movein,note:r.note,shown:list(r.shown),raw:r.raw,src:r.src,memo:r.memo};
  NEEDS.forEach(([k,t])=>{ if(need.includes(t)) c[k]=true; }); if(o._locked) c.locked=list(o._locked);
  Object.keys(c).forEach(k=>{ if(c[k]===undefined||c[k]==='') delete c[k]; }); return c; }
function toRowC(c){ const need=NEEDS.filter(([k])=>c[k]||(k==='park'&&(c.tags||[]).includes('주차필수'))||(k==='needIns'&&(c.tags||[]).includes('보증보험필요'))||(k==='lh'&&(c.tags||[]).includes('LH'))).map(x=>x[1]);
  const r={id:c.id,st:CST[c.st]||'대기중',d:c.d||'',name:c.name||'',phone:c.phone||'',deal:c.deal||'',budget:c.budget??'',budgetMin:c.budgetMin??'',rentMax:c.rentMax??'',
    cats:(c.cats||(c.cat?[c.cat]:[])).join(', '),areas:(c.areas||[]).join(', '),rooms:c.rooms||'',baths:c.baths||'',py:c.py||'',kw:c.kw||'',need:need.join(', '),
    people:c.people||'',movein:c.movein||'',note:c.note||'',shown:(c.shown||[]).join(', '),raw:c.raw||'',src:c.src||'',memo:c.memo||''};
  const o={}; CCOLS.forEach(([k,h])=>o[h]=String(r[k]??'')); return o; }

/* 설정: index.html 맨 아래 CONFIG.API_URL 에 주소를 넣어 두면 직원들은 비밀번호만 입력하면 됩니다 */
const LSX={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const apiUrl=()=>LSX.get('mj_api')||CONFIG.API_URL||'';
/* 비밀번호 두 단계: 사무실(mj_key, 이 브라우저에 기억) / 열람(mj_full, 기본은 브라우저를 닫거나 30분 쉬면 잠김) */
const SSX={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const fullKey=()=>SSX.get('mj_full')||LSX.get('mj_full')||'';
const apiKey=()=>fullKey()||LSX.get('mj_key')||'';
const isShared=()=>!!(apiUrl()&&apiKey());
const SECRET_H={listings:['연락처','내놓은분','집보는법','원문'],clients:['연락처','원문']};
S.level=0;
const canSee=()=>!isShared()||S.level>=2;
function lockAll(msg){ SSX.set('mj_full',null); LSX.set('mj_full',null); S.level=Math.min(S.level,1); if(msg) toast(msg); loadAll(true); }
let lastAct=Date.now(); ['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },true));
setInterval(()=>{ if(fullKey() && !LSX.get('mj_full') && Date.now()-lastAct>30*60000) lockAll('30분 동안 사용이 없어 열람을 잠갔습니다'); },60000);
async function unlock(pw,remember){ if(!pw){ toast('열람 비밀번호를 입력하세요'); return false; }
  try{ const r=await fetch(apiUrl()+'?action=list&key='+encodeURIComponent(pw)+'&t='+Date.now()); const j=await r.json();
    if(!j.ok||j.level<2){ toast('열람 비밀번호가 맞지 않습니다'); return false; }
    if(remember) LSX.set('mj_full',pw); else SSX.set('mj_full',pw);
    toast('연락처·현관 비밀번호를 볼 수 있습니다'); await loadAll(true); return true; }
  catch(e){ toast('연결하지 못했습니다'); return false; } }
function setSync(txt,live){ $('#syncTxt').textContent=txt; $('#dot').classList.toggle('live',!!live); }
async function apiGet(){ const r=await fetch(apiUrl()+'?action=list&key='+encodeURIComponent(apiKey())+'&t='+Date.now()); const j=await r.json(); if(!j.ok) throw new Error(j.error||'fail'); return j; }
async function apiPost(body){ const r=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:apiKey(),...body})}); const j=await r.json(); if(!j.ok) throw new Error(j.error||'fail'); return j; }
function localLoad(){ try{ const j=JSON.parse(LSX.get('mj_local')||'{}'); S.L=j.L||[]; S.C=j.C||[]; S.E=j.E||[]; S.K=j.K||[]; }catch(e){ S.L=[]; S.C=[]; S.E=[]; S.K=[]; } }
function localSave(){ LSX.set('mj_local',JSON.stringify({L:S.L,C:S.C,E:S.E,K:S.K})); }
let pending=0;
async function loadAll(quiet){
  if(!isShared()){ localLoad(); S.live=true; setSync('이 컴퓨터에만 저장 중 · 설정 필요',false); refresh(); return; }
  if(pending) return;
  try{ if(!quiet) setSync('불러오는 중',false); const j=await apiGet(); if(pending) return;
    S.L=(j.listings||[]).map(fromRowL).filter(l=>l.id); S.C=(j.clients||[]).map(fromRowC).filter(c=>c.id); S.level=j.level||1;
    S.schedOld=!Array.isArray(j.schedule); S.E=(j.schedule||[]).map(fromRowS).filter(e=>e.id); S.K=((j.tabs||{})['계약']||[]).map(fromRowK).filter(k=>k.id);
    if(fullKey()&&S.level<2){ SSX.set('mj_full',null); LSX.set('mj_full',null); }
    S.live=true; setSync((S.level>=2?'전체 열람 중':'공유 매물장 연결됨')+' · '+new Date().toTimeString().slice(0,5),true); refresh(); }
  catch(e){ S.live=true; setSync(String(e.message)==='password'?'비밀번호가 맞지 않습니다':'연결 실패 · 설정 확인',false); refresh(); }
}
const KEY={listings:'L',clients:'C',schedule:'E','계약':'K'};
async function putRec(kind,rec,okMsg){ const arr=S[KEY[kind]]; const i=arr.findIndex(x=>x.id===rec.id); const exists=i>=0; if(exists) arr[i]=rec; else arr.push(rec); refresh();
  if(!isShared()){ localSave(); if(okMsg) toast(okMsg+' (이 컴퓨터에만)'); return true; }
  const row=kind==='listings'?toRowL(rec):kind==='clients'?toRowC(rec):kind==='계약'?toRowK(rec):toRowS(rec); if(exists&&!canSee()) (SECRET_H[kind]||[]).forEach(h=>delete row[h]);
  pending++; try{ await apiPost({action:'upsert',sheet:kind,id:rec.id,rec:row}); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast(String(e.message)==='sheet'?'구글 Apps Script를 새 버전으로 배포해야 일정을 저장할 수 있습니다.':'저장하지 못했습니다. 인터넷 연결과 설정을 확인하고 다시 눌러 주세요.'); return false; }
  finally{ pending--; if(!pending) loadAll(true); } }
async function updateRec(kind,id,patch,okMsg){ const arr=S[KEY[kind]]; const cur=arr.find(x=>x.id===id); if(!cur) return false; return putRec(kind,{...cur,...patch},okMsg); }
async function removeRec(kind,id,okMsg){ S[KEY[kind]]=S[KEY[kind]].filter(x=>x.id!==id); refresh();
  if(!isShared()){ localSave(); if(okMsg) toast(okMsg); return true; }
  pending++; try{ await apiPost({action:'delete',sheet:kind,id}); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast(String(e.message)==='level'?'삭제는 열람 비밀번호를 입력한 직원만 할 수 있습니다.':'삭제하지 못했습니다. 다시 눌러 주세요.'); return false; } finally{ pending--; if(!pending) loadAll(true); } }
setInterval(()=>{ if(isShared()&&document.visibilityState==='visible') loadAll(true); },60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&isShared()) loadAll(true); });

  <section class="panel" style="max-width:720px"><h3>1단계 · 사무실 비밀번호</h3><p class="sub" style="font-size:13px">매물 보기·검색·손님 응대·새 매물 접수. 이 컴퓨터에 기억됩니다.</p>
    <div class="fgrid">
      ${fixed?'':`<label class="field full"><span>구글 Apps Script 웹앱 주소</span><input type="text" id="set-api" value="${esc(LSX.get('mj_api')||'')}" placeholder="https://script.google.com/macros/s/…/exec"><small>관리자에게 받은 주소를 붙여 넣으세요.</small></label>`}
      <label class="field full"><span>사무실 비밀번호</span><input type="password" id="set-key" value="${esc(LSX.get('mj_key')||'')}" placeholder="관리자에게 받은 비밀번호" autocomplete="off"></label>
    </div>

  <section class="panel" style="max-width:720px"><h3>2단계 · 열람 비밀번호 (연락처·현관 비밀번호)</h3>
    <p class="sub" style="font-size:13px">집주인·손님 연락처, 현관 비밀번호, 매물장 원문, 삭제는 이 비밀번호를 입력한 사람만 됩니다. 기본은 브라우저를 닫거나 30분 동안 쓰지 않으면 다시 잠깁니다.</p>
    ${isShared()&&S.level>=2?'<div class="row" style="margin-top:10px"><span class="tag good">열람 중</span><button class="btn sm" data-act="lockNow">지금 잠그기</button></div>':(isShared()?lockBox('열람 비밀번호'):'<p class="sub">먼저 1단계를 연결하세요.</p>')}</section>
  <section class="panel" style="max-width:720px"><h3>비밀번호를 잊었을 때</h3>
    <p class="sub" style="font-size:13px">관리자가 구글 시트의 <b>「설정」 탭</b>을 열면 B1(사무실), B2(열람)에 적혀 있습니다. 거기서 바꾸면 바로 적용됩니다.</p></section>`; }
let rT=null; function refresh(){ clearTimeout(rT); rT=setTimeout(()=>{ const a=document.activeElement; const inDrawer=a&&a.closest&&a.closest('.drawer'); if(a&&a.matches('input,textarea,select')&&a.id){ partial(); } else render(); if(DR&&!inDrawer) renderDrawer(); },60); }

/* ---------- 렌더 ---------- */
function render(){ const v=S.view;
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const m=$('#main');
  m.innerHTML= v==='seek'?viewSeek(): v==='sell'?viewSell(): v==='search'?viewSearch(): v==='clients'?viewClients(): v==='setup'?viewSetup(): v==='schedule'?viewSchedule(): v==='deals'?viewDeals(): viewHome(); }
/* 입력 중에는 포커스를 지키며 결과만 갱신 */
function partial(){ const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart;
  render(); if(id){ const el=document.getElementById(id); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } } }
function route(){ const h=(location.hash||'#home').slice(1); S.view=['seek','sell','search','clients','setup','schedule','deals'].includes(h)?h:'home'; closeDrawer(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange',route);

/* ---------- 이벤트 ---------- */
function qOf(scope){ return scope==='seek'?SEEK.q:scope==='client'?(DR&&DR.cq)||emptyQ():FIND.q; }
let typeT=null;
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset.q){ const q=qOf(t.dataset.scope); q[t.dataset.q]=t.value; clearTimeout(typeT); typeT=setTimeout(partial,180); return; }
  if(t.dataset.who){ SEEK.who[t.dataset.who]=t.value; return; }
  if(t.dataset.calc){ if(t.type==='checkbox') return; CALC[t.dataset.calc]=t.value; const out=$('#calcOut'); if(out){ const tmp=document.createElement('div'); tmp.innerHTML=calcHTML(); const n=tmp.querySelector('#calcOut'); if(n) out.innerHTML=n.innerHTML; } return; }
  if(t.dataset.ev&&DR&&DR.ev){ DR.ev[t.dataset.ev]=t.value; return; }
  if(t.dataset.k&&DR&&DR.k){ const f=t.dataset.k; DR.k[f]=t.value; if(f==='feeS'||f==='feeB'){ DR.k[f+'man']=t.value!==''; return; }
    if(f==='price'){ const h=$('#k-price-h'); if(h) h.textContent=parseMan(t.value)?man(parseMan(t.value))+' 만원':''; }
    if(['price','aCon','aMid'].includes(f)){ const bal=$('#k-aBal'); const tot=parseMan(DR.k.price)||0; if(bal&&tot) bal.placeholder=Math.max(0,tot-(parseMan(DR.k.aCon)||0)-(parseMan(DR.k.aMid)||0)); }
    if(['price','rent'].includes(f)){ const x=$('#kcalc'); if(x) x.innerHTML=feeBox({...DR.k,price:parseMan(DR.k.price)||0}); } return; }
  if(t.id==='f-paste'){ SELL.paste=t.value; return; }
  if(t.dataset.f){ SELL.f[t.dataset.f]=t.value; if(t.dataset.f==='sup'||t.dataset.f==='ex'){ const v=+(SELL.f.sup||SELL.f.ex); if(v) SELL.f.py=String(pyOf(v)); } clearTimeout(typeT); typeT=setTimeout(partial,250); return; }
  if(t.dataset.deal){ const d=SELL.f.deals[+t.dataset.deal]; d[t.dataset.dk]=t.value; if(t.dataset.dk==='t'){ render(); return; } clearTimeout(typeT); typeT=setTimeout(partial,250); return; }
});
document.addEventListener('change',async e=>{ const t=e.target;
  if(t.dataset.qc){ qOf(t.dataset.scope)[t.dataset.qc]=t.checked; partial(); return; }
  if(t.dataset.q && t.tagName==='SELECT'){ qOf(t.dataset.scope)[t.dataset.q]=t.value; partial(); return; }
  if(t.dataset.ev&&DR&&DR.ev){ DR.ev[t.dataset.ev]=t.value; if(t.tagName==='SELECT'||t.type==='date') renderDrawer(); return; }
  if(t.dataset.calc==='vat'){ CALC.vat=t.checked; renderCalc(); return; }
  if(t.dataset.k&&DR&&DR.k){ const f=t.dataset.k; DR.k[f]=t.value; if(f==='feeS'||f==='feeB'){ DR.k[f+'man']=t.value!==''; const x=$('#kcalc'); if(x) x.innerHTML=feeBox({...DR.k,price:parseMan(DR.k.price)||0}); } return; }
  if(t.dataset.kc&&DR&&DR.k){ DR.k[t.dataset.kc]=t.checked; const x=$('#kcalc'); if(x) x.innerHTML=feeBox({...DR.k,price:parseMan(DR.k.price)||0}); return; }
  if((t.id==='k-l'||t.id==='k-c')&&DR&&DR.k){ const m=t.value.match(/#(\S+)\s*$/); const id=m?m[1]:'';
    if(t.id==='k-l'){ DR.k.lid=id; const l=S.L.find(x=>x.id===id); if(l&&!DR.id){ const n=newContract({lid:id,cid:DR.k.cid}); Object.assign(DR.k,{mode:n.mode,coop:n.coop,coopTel:n.coopTel,deal:n.deal,kind:n.kind,price:n.price,rent:n.rent}); } }
    else DR.k.cid=id; renderDrawer(); return; }
  if((t.id==='ev-l'||t.id==='ev-c')&&DR&&DR.ev){ const m=t.value.match(/#(\S+)\s*$/); DR.ev[t.id==='ev-l'?'lid':'cid']=m?m[1]:''; renderDrawer(); return; }
  if(t.dataset.act==='schedWho'){ SCH.who=t.value; render(); return; }
  if(t.id==='f-name'){ const c=findComplex(t.value); if(c){ applyComplex(c,SELL.f,false); toast(c.name+' 단지 정보를 채웠습니다'); } autoDir(false); render(); return; }
  if(t.id==='f-dongho'){ const was=SELL.f.dir; autoDir(SELL.filled&&SELL.filled.has('dir')); if(SELL.f.dir!==was) toast('향을 '+SELL.f.dir+'(으)로 채웠습니다'); render(); return; }
  if(t.dataset.f && t.tagName==='SELECT'){ SELL.f[t.dataset.f]=t.value; if(t.dataset.f==='dir'&&SELL.filled) SELL.filled.delete('dir'); render(); return; }
  if(t.dataset.deal && t.dataset.dk==='t'){ const d=SELL.f.deals[+t.dataset.deal]; d.t=t.value; render(); return; }
  if(t.dataset.act==='sort'){ FIND.sort=t.value; try{ localStorage.setItem('mj_sort',t.value); }catch(e){} render(); return; }
  if(t.dataset.act==='clientSt'){ await updateRec('clients',t.dataset.id,{st:t.value},'상태를 바꿨습니다'); return; }
  if(t.dataset.act==='lst'){ await updateRec('listings',DR.id,{st:t.value},'매물 상태를 바꿨습니다'); return; }
});
document.addEventListener('toggle',e=>{ if(e.target.id==='moreBox') SELL.moreOpen=e.target.open; },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&DR) closeDrawer(); if(e.key==='Enter'&&e.target.id==='unlock-pw') document.querySelector('[data-act=unlock]')?.click(); });
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-go],[data-chip],[data-fchip],[data-seekstep],[data-sellstep]'); if(!t) return;
  if(t.dataset.go){ location.hash=t.dataset.go; return; }
  if(t.dataset.chip){ const q=qOf(t.dataset.scope), k=t.dataset.chip, v=t.dataset.val;
    if(t.dataset.multi==='1'){ q[k]=q[k].includes(v)?q[k].filter(x=>x!==v):[...q[k],v]; } else { q[k]= q[k]===v?'':v; if(k==='deal'){ q.rentMax=''; } }
    if(t.dataset.scope==='client'){ renderDrawer(); return; } render(); return; }
  if(t.dataset.fchip){ const f=SELL.f, k=t.dataset.fchip, v=t.dataset.val;
    if(t.dataset.multi==='1') f[k]=f[k].includes(v)?f[k].filter(x=>x!==v):[...f[k],v]; else f[k]= f[k]===v?'':v; render(); return; }
  if(t.dataset.seekstep!=null){ const n=+t.dataset.seekstep; if(n<0||n>4) return; SEEK.step=n; render(); window.scrollTo(0,0); return; }

  const a=t.dataset.act;
  if(a==='open'){ if(t.dataset.id==='_preview') return; openListing(t.dataset.id); return; }
  if(a==='openClient'){ openClient(t.dataset.id); return; }
  if(a==='close'){ closeDrawer(); return; }
  if(a==='pick'){ const id=DR.id; SEEK.picks=SEEK.picks.includes(id)?SEEK.picks.filter(x=>x!==id):[...SEEK.picks,id]; toast(SEEK.picks.includes(id)?'보여줄 집에 담았습니다':'뺐습니다'); renderDrawer(); render(); return; }
  if(a==='edit'){ const l=S.L.find(x=>x.id===DR.id); SELL.f=listingToF(l); SELL.editId=l.id; SELL.step=1; SELL.saved=null; closeDrawer(); if(location.hash!=='#sell') location.hash='sell'; else render(); return; }
  if(a==='touch'){ await updateRec('listings',DR.id,{d:todayISO()},'오늘 날짜로 확인 표시했습니다'); return; }
  if(a==='delL'){ if(!DR.del){ DR.del=true; renderDrawer(); return; } const id=DR.id; closeDrawer(); await removeRec('listings',id,'삭제했습니다'); return; }
  if(a==='delC'){ if(!DR.del){ DR.del=true; renderDrawer(); return; } const id=DR.id; closeDrawer(); await removeRec('clients',id,'삭제했습니다'); return; }
  if(a==='saveSetup'){ const u=($('#set-api')?.value||'').trim(), k=$('#set-key').value.trim(); if(u) LSX.set('mj_api',u); LSX.set('mj_key',k||null);
    if(!apiUrl()){ toast('웹앱 주소를 입력해 주세요'); return; } await loadAll(); render(); return; }
  if(a==='unlock'){ const ok=await unlock($('#unlock-pw').value.trim(),$('#unlock-rem')?.checked); if(ok){ renderDrawer(); render(); } return; }
  if(a==='lockNow'){ lockAll('열람을 잠갔습니다'); renderDrawer(); render(); return; }
  if(a==='logout'){ LSX.set('mj_key',null); SSX.set('mj_full',null); LSX.set('mj_full',null); S.level=0; toast('이 컴퓨터에서 비밀번호를 모두 지웠습니다'); loadAll(); render(); return; }
  if(a==='editClientQ'){ const c=S.C.find(x=>x.id===t.dataset.id); if(!c) return; const q=clientQ(c); q.cats=[...q.cats]; q.areas=[...q.areas]; q.hideOld=false; DR.cq=q; renderDrawer(); return; }
  if(a==='cancelClientQ'){ DR.cq=null; renderDrawer(); return; }
  if(a==='saveClientQ'){ const q=DR.cq; const id=t.dataset.id; const num=v=>{ const n=parseFloat(v); return isNaN(n)||!n?undefined:n; };
    const patch={deal:q.deal,budget:parseMan(q.budget)||undefined,budgetMin:parseMan(q.budgetMin)||undefined,rentMax:q.rentMax===''?undefined:+q.rentMax,cats:q.cats,areas:q.areas,
      rooms:+q.rooms||undefined,baths:+q.baths||undefined,py:num(q.py),kw:q.kw,elev:q.elev,park:q.park,pet:q.pet,needIns:q.needIns,lh:q.lh,tags:[]};
    DR.cq=null; if(await updateRec('clients',id,patch,'조건을 저장했습니다')) renderDrawer(); return; }
  if(a==='calcOpen'){ CALC.open=true; renderCalc(); setTimeout(()=>$('#calc-price')?.focus(),30); return; }
  if(a==='calcClose'){ CALC.open=false; renderCalc(); return; }
  if(a==='calcSet'){ CALC[t.dataset.k]=t.dataset.val; renderCalc(); return; }
  if(a==='calcCopy'){ const txt=$('#calcSay')?.textContent||''; try{ await navigator.clipboard.writeText(txt); toast('복사했습니다'); }catch(e){ const r=document.createRange(); r.selectNodeContents($('#calcSay')); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); toast('글자를 선택해 두었습니다. Ctrl+C로 복사하세요'); } return; }
  if(a==='calcListing'){ const l=S.L.find(x=>x.id===t.dataset.id); if(l) openCalcFor(l); return; }
  if(a==='newContract'){ openNewContract({lid:t.dataset.lid,cid:t.dataset.cid}); return; }
  if(a==='openContract'){ openContract(t.dataset.id); return; }
  if(a==='kmode'||a==='kdeal'||a==='kkind'){ DR.k[{kmode:'mode',kdeal:'deal',kkind:'kind'}[a]]=t.dataset.val; DR.k.price=DR.k.price; renderDrawer(); return; }
  if(a==='saveContract'){ await saveContract(); return; }
  if(a==='delContract'){ if(!DR.del){ DR.del=true; renderDrawer(); return; } const id=DR.id; const k=S.K.find(x=>x.id===id); closeDrawer();
    if(await removeRec('계약',id,'계약을 삭제했습니다')) for(const e of (k&&k.evIds)||[]) await removeRec('schedule',e,''); render(); return; }
  if(a==='newEvent'){ openNewEvent({date:t.dataset.date,lid:t.dataset.lid,cid:t.dataset.cid,type:t.dataset.type}); return; }
  if(a==='openEvent'){ openEvent(t.dataset.id); return; }
  if(a==='evType'){ DR.ev.type=t.dataset.val; renderDrawer(); return; }
  if(a==='schedMode'){ SCH.mode=t.dataset.m; try{ localStorage.setItem('mj_smode2',SCH.mode); }catch(e){} SCH.past=0; render(); return; }
  if(a==='schedPast'){ SCH.past=+t.dataset.d?SCH.past+1:0; render(); return; }
  if(a==='gotoWeek'){ SCH.mode='week'; SCH.anchor=t.dataset.date; render(); return; }
  if(a==='schedNav'){ const d=+t.dataset.d; if(!d) SCH.anchor=todayISO(); else if(SCH.mode==='month'){ const dt=new Date(SCH.anchor+'T00:00:00'); dt.setDate(1); dt.setMonth(dt.getMonth()+d); SCH.anchor=isoOf(dt); } else SCH.anchor=addDays(SCH.anchor||todayISO(),7*d); render(); return; }

    const isNew=!DR.id; if(isNew) e.id='E'+Date.now().toString(36); if(!e.made) e.made=todayISO(); if(e.who) LSX.set('mj_who',e.who);
    Object.keys(e).forEach(k=>{ if(e[k]===''||e[k]==null) delete e[k]; });
    if(await putRec('schedule',e,isNew?'일정을 저장했습니다':a==='doneEvent'?'완료로 바꿨습니다':'일정을 고쳤습니다')){ if(S.view==='schedule') SCH.anchor=e.date; closeDrawer(); render(); } return; }
  if(a==='delEvent'){ if(!DR.del){ DR.del=true; renderDrawer(); return; } const id=DR.id; closeDrawer(); await removeRec('schedule',id,'일정을 삭제했습니다'); render(); return; }
  if(a==='addNote'){ const id=t.dataset.id; const txt=($('#cl-addnote')?.value||'').trim(); if(!txt){ toast('추가할 메모를 적어 주세요'); return; }

    if(await updateRec('clients',id,{note:(c.note?c.note+'\n':'')+line},'메모를 추가했습니다')) renderDrawer(); return; }
  if(a==='parsePaste'){ const txt=($('#f-paste')?.value||'').trim(); SELL.paste=txt; if(!txt){ toast('붙여넣을 내용을 먼저 넣어 주세요'); return; }
    const p=parseTemplate(txt); const n=applyParsed(p); SELL.pasteMsg=n?`${n}개 칸을 채웠습니다${p.cx?' · '+p.cx.name+' 단지 정보 자동 입력':''}. 노란 '자동' 표시를 확인하세요.`:'알아볼 수 있는 내용이 없습니다. 직접 입력해 주세요.'; render(); return; }
  if(a==='pickType'){ const c=findComplex(SELL.f.name); const tp=c&&c.types[+t.dataset.i]; if(tp){ applyType(tp,SELL.f,true); render(); } return; }

});
